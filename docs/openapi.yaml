openapi: 3.0.3
info:
  title: Homelab Management API
  version: 1.0.0
servers:
  - url: /api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: string
paths:
  /auth/setup:
    post:
      summary: Create first admin account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '201': { description: Setup complete }
        '422': { description: Invalid input }
  /auth/login:
    post:
      summary: Login
      description: >
        On success returns a session. If the account has TOTP two-factor
        enabled and the password is correct, returns 202 with a short-lived
        `mfaToken` to spend at `/auth/login/totp` — no session is created yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200': { description: Logged in }
        '202':
          description: Password accepted, second factor required
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfaRequired: { type: boolean, enum: [true] }
                  mfaToken: { type: string, description: 5-minute hand-off token }
        '401': { description: Invalid credentials }
        '422': { description: Invalid input }
  /auth/login/totp:
    post:
      summary: Complete a two-factor login
      description: >
        Second step of a 2FA sign-in. `code` is a 6-digit TOTP code or one of
        the account's single-use recovery codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken, code]
              properties:
                mfaToken: { type: string }
                code: { type: string, minLength: 6, maxLength: 32 }
      responses:
        '200': { description: Logged in }
        '401': { description: Expired hand-off token or invalid code }
        '422': { description: Invalid input }
  /auth/totp/status:
    get:
      security:
        - bearerAuth: []
      summary: TOTP enrolment status for the current account
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  enrolledAt: { type: string, format: date-time, nullable: true }
                  recoveryCodesRemaining: { type: integer }
        '401': { description: Not authenticated }
  /auth/totp/setup:
    post:
      security:
        - bearerAuth: []
      summary: Begin TOTP enrolment
      description: >
        Mints a pending secret (2FA stays off until activated) and returns the
        enrolment QR and key URI.
      responses:
        '200':
          description: Pending secret created
          content:
            application/json:
              schema:
                type: object
                properties:
                  otpauthUri: { type: string }
                  qrSvg: { type: string, description: inline SVG }
                  secret: { type: string, description: base32, for manual entry }
        '401': { description: Not authenticated }
        '409': { description: Two-factor is already enabled }
  /auth/totp/activate:
    post:
      security:
        - bearerAuth: []
      summary: Activate TOTP after verifying a code
      description: >
        Verifies a 6-digit code against the pending secret, turns 2FA on, and
        returns the ten single-use recovery codes once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: Two-factor enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean, enum: [true] }
                  recoveryCodes:
                    type: array
                    items: { type: string }
        '400': { description: Wrong code, or no pending secret }
        '401': { description: Not authenticated }
        '422': { description: Invalid input }
  /auth/totp/disable:
    post:
      security:
        - bearerAuth: []
      summary: Disable TOTP
      description: >
        Re-verifies with exactly one of a current 6-digit code or the account
        password, then clears the secret and all recovery codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, pattern: '^\d{6}$' }
                password: { type: string }
      responses:
        '200': { description: Two-factor disabled }
        '400': { description: Re-verification failed }
        '401': { description: Not authenticated }
        '422': { description: Both or neither of code/password supplied }
  /auth/refresh:
    post:
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: Refreshed }
        '401': { description: Invalid refresh token }
  /auth/logout:
    post:
      security:
        - bearerAuth: []
      summary: Logout and revoke refresh token
      responses:
        '200': { description: Logged out }
  /services/status:
    get:
      security:
        - bearerAuth: []
      summary: Get service status map
      responses:
        '200': { description: Service status }
  /services/{name}/start:
    post:
      security:
        - bearerAuth: []
      summary: Start a service
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200': { description: Start requested }
        '400': { description: Invalid service name }
        '422': { description: Validation error }
  /services/{name}/stop:
    post:
      security:
        - bearerAuth: []
      summary: Stop a service
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200': { description: Stop requested }
        '400': { description: Invalid service name }
        '422': { description: Validation error }
  /settings/cloudflare-token:
    get:
      security:
        - bearerAuth: []
      summary: Get Cloudflare token status
      responses:
        '200': { description: Current config }
    put:
      security:
        - bearerAuth: []
      summary: Save Cloudflare token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 20, maxLength: 4096 }
      responses:
        '200': { description: Token saved }
        '422': { description: Validation error }
  /settings/cloudflare-token/test:
    post:
      security:
        - bearerAuth: []
      summary: Test Cloudflare token
      responses:
        '200': { description: Test successful }
        '400': { description: Invalid token or test failed }
  /health:
    get:
      security:
        - bearerAuth: []
      summary: Get health status and thresholds
      responses:
        '200': { description: Health payload }
  /health/thresholds:
    put:
      security:
        - bearerAuth: []
      summary: Update health thresholds
      responses:
        '200': { description: Updated }
        '422': { description: Validation error }
  /audit-logs:
    get:
      security:
        - bearerAuth: []
      summary: List audit logs
      responses:
        '200': { description: Audit log page }
  /users:
    get:
      security:
        - bearerAuth: []
      summary: List admin accounts
      responses:
        '200': { description: List of users }
    post:
      security:
        - bearerAuth: []
      summary: Create a new admin account
      responses:
        '201': { description: User created }
        '409': { description: Username already exists }
        '422': { description: Validation error }
  /users/{id}/password:
    put:
      security:
        - bearerAuth: []
      summary: Reset an admin account's password
      responses:
        '200': { description: Password updated }
        '404': { description: User not found }
        '422': { description: Validation error }
  /users/{id}:
    delete:
      security:
        - bearerAuth: []
      summary: Delete an admin account
      responses:
        '200': { description: User deleted }
        '400': { description: Cannot delete own account or last remaining admin }
        '404': { description: User not found }
  /settings/exposure:
    get:
      security:
        - bearerAuth: []
      summary: Read first-start exposure provisioning settings (base domain, NPM, Cloudflare)
      responses:
        '200': { description: Exposure settings }
    put:
      security:
        - bearerAuth: []
      summary: Save first-start exposure provisioning settings
      responses:
        '200': { description: Saved }
        '422': { description: Validation error }
  /services/{name}/exposure:
    get:
      security:
        - bearerAuth: []
      summary: Read per-service exposure configuration and provisioning status
      responses:
        '200': { description: Exposure configuration }
        '400': { description: Invalid service name }
    put:
      security:
        - bearerAuth: []
      summary: Configure per-service exposure (enable/disable, upstream host/port)
      responses:
        '200': { description: Saved }
        '400': { description: Invalid service name }
        '422': { description: Validation error }
  /recovery/status:
    get:
      summary: Check recovery mode status
      responses:
        '200': { description: Recovery status }
  /recovery/enable:
    post:
      summary: Enable recovery mode (localhost only)
      responses:
        '200': { description: Enabled }
        '403': { description: Not localhost }
  /recovery/reset-admin-password:
    post:
      summary: Reset admin password (localhost + recovery mode)
      responses:
        '200': { description: Password reset }
        '422': { description: Validation error }
