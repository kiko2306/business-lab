
services:
  nextcloud:
    image: nextcloud:latest
    restart: unless-stopped
    ports:
      - "${NEXTCLOUD_PORT:-10260}:80"
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost}
      # Empty unless the dashboard enables public exposure, which injects the
      # public host/proto/proxy here so Nextcloud emits https:// URLs and
      # stops rejecting the proxied hostname.
      OVERWRITEHOST: ${NEXTCLOUD_OVERWRITEHOST:-}
      OVERWRITEPROTOCOL: ${NEXTCLOUD_OVERWRITEPROTOCOL:-}
      TRUSTED_PROXIES: ${NEXTCLOUD_TRUSTED_PROXIES:-}
    labels:
      - "homepage.group=Media & Files"
      - "homepage.name=Nextcloud"
      - "homepage.icon=nextcloud.png"
      - "homepage.href=http://localhost:${NEXTCLOUD_PORT:-10260}"
      - "homepage.description=File sync, calendar, and contacts"
    volumes:
      - ./data/app:/var/www/html
      # The tree File Browser and Samba already share (plan.md §202/§219),
      # mounted at a path outside the webroot — writing into ./data/app
      # directly would desync Nextcloud's own file cache. Register it once
      # via Admin settings -> External Storage (local, /shared): the create
      # API is #[PasswordConfirmationRequired(strict: true)] upstream, which
      # only a real interactive session can satisfy, so this one step can't
      # be scripted (see docs/app-credentials.md).
      - ../file-browser/data/files:/shared
    depends_on:
      nextcloud-db:
        condition: service_healthy
    networks:
      - nextcloud-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # `backgroundjobs_mode` is `cron` (Nextcloud's own recommended mode) but
  # nothing was ever running it (plan.md §224) — trash/version expiry,
  # share-expiry notices, activity mail and files_antivirus's background
  # rescan all silently never fired. Upstream's own documented fix: the same
  # image, entrypoint swapped to its bundled /cron.sh, sharing the app volume
  # so it sees the same config/data as the web container.
  nextcloud-cron:
    image: nextcloud:latest
    restart: unless-stopped
    entrypoint: /cron.sh
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - ./data/app:/var/www/html
    depends_on:
      nextcloud:
        condition: service_healthy
    networks:
      - nextcloud-net

  # Nextcloud's own admin docs put 16 at the top of the officially-supported
  # range; 17+ isn't validated by upstream yet, so this isn't a stale pin.
  nextcloud-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - nextcloud-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXTCLOUD_DB_USER:-nextcloud}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  nextcloud-net:
    driver: bridge
