services:
  grocy:
    image: lscr.io/linuxserver/grocy:latest
    restart: unless-stopped
    ports:
      - "${GROCY_PORT:-8012}:80"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    labels:
      - "homepage.group=Productivity"
      - "homepage.name=Grocy"
      - "homepage.icon=grocy.png"
      - "homepage.href=http://localhost:${GROCY_PORT:-8012}"
      - "homepage.description=Pantry/household stock manager (expiration dates, shopping list)"
    volumes:
      # DB, uploaded files, PHP config — everything grocy owns.
      - ./data/config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
