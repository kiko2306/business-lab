
services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    ports:
      - "${HA_PORT:-8123}:8123"
    environment:
      TZ: ${TZ:-UTC}
    labels:
      - "homepage.group=Home Automation"
      - "homepage.name=Home Assistant"
      - "homepage.icon=home-assistant.png"
      - "homepage.href=http://localhost:${HA_PORT:-8123}"
      - "homepage.description=Home automation platform"
    volumes:
      - ./data:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/manifest.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
