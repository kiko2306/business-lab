
services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "${NPM_HTTP_PORT:-80}:80"
      - "${NPM_HTTPS_PORT:-443}:443"
      - "${NPM_ADMIN_PORT:-10270}:81"
    environment:
      DB_MYSQL_HOST: npm-db
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: ${NPM_DB_USER:-npm}
      DB_MYSQL_PASSWORD: ${NPM_DB_PASSWORD}
      DB_MYSQL_NAME: ${NPM_DB_NAME:-npm}
    labels:
      - "homepage.group=Infrastructure"
      - "homepage.name=Nginx Proxy Manager"
      - "homepage.icon=nginx-proxy-manager.png"
      - "homepage.href=http://localhost:${NPM_ADMIN_PORT:-10270}"
      - "homepage.description=Reverse proxy and certificate management"
    volumes:
      - ./data/app:/data
      - ./data/letsencrypt:/etc/letsencrypt
      # Authelia forward-auth snippets — `include /snippets/...;` in a proxy
      # host's Advanced config to put it behind Authelia. See
      # apps/authelia/config/configuration.yml for the SSO side of this.
      - ./snippets:/snippets:ro
      # CrowdSec's Lua bouncer: the vendored library, the ban page, and the
      # backend-rendered crowdsec-nginx-bouncer.conf that holds the LAPI key
      # (§119). Mounted whether or not enforcement is on — the http_top.conf
      # block that actually loads it is what the dashboard toggle controls.
      # The *directory* is mounted, not the files inside it, so a not-yet-
      # rendered .conf can't make Docker auto-create a directory in its place.
      - ./crowdsec-bouncer:/crowdsec:ro
    depends_on:
      npm-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - npm-net
      # Reaches CrowdSec's local API at http://crowdsec:8080 for the decision
      # stream. CrowdSec is a separate compose project, so this is an external
      # network both projects attach to — created by the backend before either
      # starts (config/services.ts `externalNetworks`). Keeping LAPI here
      # rather than on a published port keeps it off the LAN entirely.
      - crowdsec-lapi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:81/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MySQL, not MariaDB, and pinned to 8: NPM's own setup docs recommend MySQL
  # 8 specifically — MariaDB's JSON column type doesn't match NPM's migration
  # schema and throws parse errors on init (a long-standing, still-open class
  # of upstream issue). This is the one DB pin in this file that isn't
  # MariaDB, and that's deliberate, not an oversight.
  npm-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NPM_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${NPM_DB_NAME:-npm}
      MYSQL_USER: ${NPM_DB_USER:-npm}
      MYSQL_PASSWORD: ${NPM_DB_PASSWORD}
    volumes:
      - ./data/db:/var/lib/mysql
    networks:
      - npm-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  npm-net:
    driver: bridge
  # Shared with the crowdsec compose project; see the nginx-proxy-manager
  # service above. Declared external so both projects join the same network
  # instead of each creating its own <project>_crowdsec-lapi.
  crowdsec-lapi:
    external: true
