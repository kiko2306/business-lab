# Standard proxy headers/tuning Authelia's integration guide pairs with the
# forward-auth snippets — NPM sets some of these itself by default, but this
# matches the officially documented combination exactly rather than relying
# on that overlap staying compatible across NPM versions.

## Headers
proxy_set_header Host $host;
# The forwarded scheme is hard-coded to https, NOT $scheme. Cloudflare
# terminates TLS at its edge and cloudflared speaks plain HTTP to NPM, so
# $scheme is always "http" here — which made apps that build their own
# external URL from X-Forwarded-Proto (Homebox's OIDC redirect_uri, plan.md
# §280) emit http:// links that then fail redirect_uri validation. Since
# §279 bound NPM's proxy ports to loopback, the *only* path to them is
# cloudflared → 127.0.0.1, and that is always an HTTPS request at the edge,
# so "https" is unconditionally correct for every proxied host.
proxy_set_header X-Original-URL https://$host$request_uri;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-URI $request_uri;
proxy_set_header X-Forwarded-Ssl on;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;

## Basic Proxy Configuration
client_body_buffer_size 128k;
proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
proxy_redirect  http://  https://;
proxy_http_version 1.1;
proxy_cache_bypass $cookie_session;
proxy_no_cache $cookie_session;
proxy_buffers 64 256k;

## Trusted Proxies Configuration
real_ip_header X-Forwarded-For;
real_ip_recursive on;

## Advanced Proxy Configuration
send_timeout 5m;
proxy_read_timeout 360;
proxy_send_timeout 360;
proxy_connect_timeout 360;
