# Restore the real visitor IP from Cloudflare's CF-Connecting-IP header.
#
# Everything reaches NPM through the Cloudflare Tunnel, so nginx's $remote_addr
# is the cloudflared container's address and every access-log line would carry
# that instead of the real client. CrowdSec (apps/crowdsec/) would then parse —
# and ask Cloudflare to ban — Cloudflare's own edge IPs. This fixes the logged
# address at the source.
#
# The dashboard normally installs this automatically: when CrowdSec starts,
# services/crowdsecConfig.ts writes a marker-fenced copy of these directives to
#   apps/nginx-proxy-manager/data/app/nginx/custom/http_top.conf
# and reloads nginx. This file is the manual fallback for when the backend
# can't write into NPM's data dir (it logs a warning telling you to do this):
# copy it to that path (create the `custom` dir if needed) and restart NPM.
#
# Cloudflare IP ranges — refresh from https://www.cloudflare.com/ips/ if edge
# requests start showing up as un-rewritten in the logs.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;
