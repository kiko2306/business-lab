# Trust Cloudflare's edge ranges for nginx's real_ip module.
#
# Deliberately does NOT set real_ip_header or real_ip_recursive: NPM's own
# nginx.conf already declares both unconditionally (real_ip_header
# X-Real-IP;), and a duplicate declaration fails nginx's config test — which
# doesn't take nginx down (it keeps serving the last-good config) but silently
# breaks every future proxy-host create/update/delete until someone notices
# (plan.md §99). Whether CrowdSec ends up seeing the real client IP at all,
# given traffic arrives via the Cloudflare Tunnel connector rather than a
# direct connection from a Cloudflare edge IP, is a separate, still-open
# question — this file does not answer it.
#
# The dashboard normally installs this automatically: when CrowdSec starts,
# services/crowdsecConfig.ts writes a marker-fenced copy of these directives to
#   apps/nginx-proxy-manager/data/app/nginx/custom/http_top.conf
# and reloads nginx. This file is the manual fallback for when the backend
# can't write into NPM's data dir (it logs a warning telling you to do this):
# copy it to that path (create the `custom` dir if needed) and restart NPM.
#
# Cloudflare IP ranges — refresh from https://www.cloudflare.com/ips/ if edge
# requests start showing up as un-rewritten in the logs.

