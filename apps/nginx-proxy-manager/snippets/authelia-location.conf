# Authelia forward-auth: shared internal location every protected proxy
# host's Advanced config includes. Reaches Authelia via the host's Docker
# bridge IP + its published port — this repo's apps live in separate Compose
# projects/networks, so container-name DNS (http://authelia:9091) doesn't
# resolve from here; 10.201.0.1 is the same host-bridge address (docker0
# gateway, per this host's custom default-address-pool in
# /etc/docker/daemon.json) the dashboard's own exposure system already uses
# for every other app (see upstream_host in the service_exposure table).
set $upstream_authelia http://10.201.0.1:9091/api/authz/auth-request;

location /internal/authelia/authz {
    internal;
    proxy_pass $upstream_authelia;

    proxy_set_header X-Original-Method $request_method;
    # Not $scheme: Cloudflare Tunnel terminates TLS at the edge and forwards
    # plain HTTP to NPM, so nginx's own $scheme here is "http" even though
    # every request that actually reaches this host arrived over HTTPS.
    # Authelia rejects an "http" target URL outright (no insecure cookies).
    proxy_set_header X-Original-URL https://$host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";

    proxy_pass_request_body off;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    proxy_redirect http:// $scheme://;
    proxy_http_version 1.1;
    proxy_cache_bypass $cookie_session;
    proxy_no_cache $cookie_session;
    proxy_buffers 4 32k;
    client_body_buffer_size 128k;

    send_timeout 5m;
    proxy_read_timeout 240;
    proxy_send_timeout 240;
    proxy_connect_timeout 240;
}
