# DB connection + encryption key — shared by the n8n service and the
# workflow-provisioning init container (which runs `n8n import:workflow`
# against the same database).
x-n8n-db-env: &n8n-db-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: n8n-db
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
  DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
  DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

services:
  # n8n runs as uid/gid 1000 (node) but Docker creates ./data/n8n root-owned,
  # so it can't write /home/node/.n8n/config. One-off chown; exits 0.
  n8n-init:
    image: busybox:stable
    user: "0:0"
    command: ["chown", "-R", "1000:1000", "/data"]
    restart: "no"
    volumes:
      - ./data/n8n:/data

  # Provisions the dashboard-managed workflows before n8n starts. For each
  # apps/n8n/workflows/<id>.json (rendered by the backend from stored
  # settings — services/n8nWorkflows.ts): import (idempotent, by the JSON's
  # id), mark active, publish (n8n 2.x only serves triggers from a *published*
  # version). n8n then registers their webhooks on boot. Re-runs every start,
  # so a rendered workflow is authoritative — UI edits to it are replaced
  # (plan.md §118.3). No-op when the directory is empty.
  n8n-workflows-init:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: "no"
    depends_on:
      n8n-init:
        condition: service_completed_successfully
      n8n-db:
        condition: service_healthy
    environment:
      <<: *n8n-db-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /workflows/*.json; do
          [ -e "$$f" ] || { echo "no managed workflows to import"; exit 0; }
          id=$$(basename "$$f" .json)
          echo "provisioning workflow $$id"
          n8n import:workflow --input="$$f"
          n8n update:workflow --id="$$id" --active=true
          n8n publish:workflow --id="$$id"
        done
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./workflows:/workflows:ro
    networks:
      - n8n-net

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      n8n-init:
        condition: service_completed_successfully
      n8n-workflows-init:
        condition: service_completed_successfully
      n8n-db:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-10240}:5678"
    # So a workflow's HTTP Request node can reach ntfy's published port on the
    # host across compose-project bridges (same approach as the crowdsec
    # service). plan.md §118.2.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *n8n-db-env
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      # Editor/base URL — set by the dashboard to the public URL when exposure
      # is enabled so the UI, webhooks and OAuth callbacks use it.
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      # SMTP for user-management emails (invites, password resets). Injected
      # from the dashboard's global mail settings (Settings → Email) when set —
      # the backend derives these via services/mailEnv.ts and flips
      # N8N_EMAIL_MODE to smtp. n8n defaults SSL and STARTTLS both to true, so
      # they're always set explicitly. Empty mode = email disabled, as before.
      N8N_EMAIL_MODE: ${N8N_EMAIL_MODE:-}
      N8N_SMTP_HOST: ${N8N_SMTP_HOST:-}
      N8N_SMTP_PORT: ${N8N_SMTP_PORT:-587}
      N8N_SMTP_USER: ${N8N_SMTP_USER:-}
      N8N_SMTP_PASS: ${N8N_SMTP_PASS:-}
      N8N_SMTP_SENDER: ${N8N_SMTP_SENDER:-}
      N8N_SMTP_SSL: ${N8N_SMTP_SSL:-false}
      N8N_SMTP_STARTTLS: ${N8N_SMTP_STARTTLS:-true}
    labels:
      - "homepage.group=Productivity"
      - "homepage.name=n8n"
      - "homepage.icon=n8n.png"
      - "homepage.href=http://localhost:${N8N_PORT:-10240}"
      - "homepage.description=Workflow automation platform"
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - n8n-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  n8n-db:
    # pgautoupgrade is a drop-in for postgres:17-alpine: same entrypoint, env
    # and config, but on start it runs `pg_upgrade --link` in place if it finds
    # an older cluster in PGDATA. n8n 2.36 logs "Postgres 15 is not supported"
    # every boot (plan.md §118.3) and stock postgres:17 will not open a v15
    # data dir, so a plain tag bump would strand the database. `--link` consumes
    # the old cluster (no rollback dir) — the scheduled `pg_dump`
    # (backup.engine=postgres for n8n) is the fallback. A fresh clone has no
    # data dir, so it just initdb's 17 with no upgrade step. MIT-licensed.
    image: pgautoupgrade/pgautoupgrade:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - n8n-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # The one-time in-place pg_upgrade runs before postgres accepts
      # connections; suppress unhealthy during it so n8n-workflows-init doesn't
      # bail on the upgrade boot. Normal boots skip the upgrade and are ready
      # in seconds.
      start_period: 90s

networks:
  n8n-net:
    driver: bridge
