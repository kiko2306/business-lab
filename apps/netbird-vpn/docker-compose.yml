
services:
  netbird-vpn:
    image: netbirdio/signal:latest
    restart: unless-stopped
    volumes:
      - netbird-data:/var/lib/netbird
    networks:
      - netbird-net

  netbird-management:
    image: netbirdio/management:latest
    restart: unless-stopped
    ports:
      - "${NETBIRD_MGMT_PORT:-8080}:8080"
    volumes:
      - netbird-mgmt-data:/var/lib/netbird
    networks:
      - netbird-net

volumes:
  netbird-data:
    driver: local
  netbird-mgmt-data:
    driver: local

networks:
  netbird-net:
    driver: bridge
