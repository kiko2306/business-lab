
services:
  netbird-vpn:
    mem_limit: 128m
    mem_reservation: 32m
    image: netbirdio/signal:latest
    restart: unless-stopped
    ports:
      # Signal is gRPC, same as management, and native clients reach it
      # DIRECTLY — management just hands them whatever Signal.URI is set to in
      # data/management.json. That used to be the internal "netbird-vpn:80",
      # which no phone off this Docker network can resolve, so signalling
      # silently never happened for remote peers (the peer would register and
      # then fail to connect to anything). Publishing it gives the
      # netbird-vpn-signal.<base-domain> exposure something to forward to —
      # see additionalExposures on netbird-vpn in backend/src/config/services.ts.
      - "${NETBIRD_SIGNAL_PORT:-10252}:80"
    volumes:
      - ./data/signal:/var/lib/netbird
    networks:
      - netbird-net

  # The actual web UI, and what gets exposed publicly — its bundled nginx
  # proxies /api and the gRPC-web management calls through to
  # netbird-management internally, so only this one container needs a public
  # hostname. Requires Authelia (see the dashboard's Depends-on / start-order
  # enforcement) since login goes through its OIDC clients — see
  # apps/authelia/config/configuration.yml.
  netbird-dashboard:
    mem_limit: 128m
    mem_reservation: 32m
    image: netbirdio/dashboard:latest
    restart: unless-stopped
    ports:
      - "${NETBIRD_DASHBOARD_PORT:-10251}:80"
    environment:
      # The dashboard image is a plain static file server — it has no
      # internal reverse-proxy for /api, so these are fetched directly by
      # the BROWSER. An internal container hostname (http://netbird-management:8080)
      # is unreachable from there; management needs its own public hostname.
      # See apps/netbird-vpn/.env.example for what provisions this.
      # Matches the auto-provisioned secondary hostname: <service>-<suffix>
      # (see additionalExposures on netbird-vpn in backend/src/config/services.ts).
      NETBIRD_MGMT_API_ENDPOINT: https://netbird-vpn-api.${BASE_DOMAIN}
      NETBIRD_MGMT_GRPC_API_ENDPOINT: https://netbird-vpn-api.${BASE_DOMAIN}
      AUTH_AUDIENCE: netbird-dashboard
      AUTH_CLIENT_ID: netbird-dashboard
      AUTH_AUTHORITY: https://authelia.${BASE_DOMAIN}
      # Must include offline_access, or Authelia never issues a refresh
      # token — the dashboard's access token then simply expires with no
      # way to silently renew it, breaking every API call (peers, users,
      # ...) with "token expired" until a full manual re-login.
      AUTH_SUPPORTED_SCOPES: "openid profile email offline_access"
      # Relative — the dashboard's own JS prepends its origin, so an absolute
      # URL here doubles up into "https://...comhttps://...com/nb-auth" and
      # Authelia rejects it as not matching the registered redirect_uris.
      AUTH_REDIRECT_URI: /nb-auth
      AUTH_SILENT_REDIRECT_URI: /nb-silent-auth
      # 'accessToken' sends Authelia's access token as the API bearer —
      # but Authelia issues an OPAQUE access token for this client (no
      # access_token_signed_response_alg configured), and netbird-management
      # validates the bearer as a JWT locally (shared/auth/jwt/validator.go),
      # so every authenticated call 401'd with "token invalid" / "token
      # contains an invalid number of segments". Confirmed live: the opaque
      # access_token 401s, the id_token (always a real JWT) succeeds against
      # the same endpoint. This was the actual cause of the dashboard's
      # endless "loads then bounces back to login" loop — every API call the
      # SPA made after login silently 401'd, so its auth-error handler kept
      # restarting the login flow. 'idToken' sends the JWT id_token instead.
      NETBIRD_TOKEN_SOURCE: idToken
      USE_AUTH0: "false"
    labels:
      - "homepage.group=Infrastructure"
      - "homepage.name=Netbird VPN"
      - "homepage.icon=netbird.png"
      - "homepage.href=https://netbird-vpn.${BASE_DOMAIN}"
      - "homepage.description=Zero-trust VPN and network access"
    depends_on:
      - netbird-management
    networks:
      - netbird-net

  netbird-management:
    mem_limit: 192m
    mem_reservation: 48m
    image: netbirdio/management:latest
    restart: unless-stopped
    ports:
      # Container port is 80, not 8080 — management.json's HttpConfig.Address
      # doesn't actually control the main HTTP+gRPC listener (that's fixed
      # unless overridden via a --port CLI flag, which the default command
      # here doesn't set); confirmed via its own startup log line ("running
      # HTTP server and gRPC server on the same port: [::]:80").
      - "${NETBIRD_MGMT_PORT:-10250}:80"
    # Fetches Authelia's OIDC config over the public internet at startup —
    # bypass the host's resolver (Docker forwards to it by default) since a
    # stale negative-cached lookup there otherwise crash-loops this container
    # for as long as that cache takes to expire.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    volumes:
      # data/management.json (gitignored) is the real working copy, generated
      # from config/management.json.example with a real DataStoreEncryptionKey
      # filled in — see .env.example for how to regenerate it. Kept read-only
      # so management can't silently rewrite it into a state that isn't
      # backed up alongside the rest of this app's config.
      - ./data/management.json:/etc/netbird/management.json:ro
      - ./data/management:/var/lib/netbird
    networks:
      - netbird-net

  # Fallback data path for peers that can't hole-punch a direct WireGuard
  # tunnel (the common case for a phone on mobile-data CGNAT reaching a home
  # peer with no port-forward). Signal only exchanges connection candidates;
  # when none work, traffic has to relay through here instead.
  #
  # Unlike signal/management this is NOT gRPC — it's WebSocket over HTTPS,
  # which is why it can traverse the Cloudflare Tunnel cleanly where a
  # native-gRPC bidirectional stream cannot (see plan.md §46.7/§46.9). Its
  # public hostname (netbird-vpn-relay.<base-domain>) is provisioned as a
  # plain websocket exposure — the third additionalExposures entry on
  # netbird-vpn in backend/src/config/services.ts, grpc:false.
  #
  # NB_EXPOSED_ADDRESS is what management hands to peers, so it must be the
  # public rels:// URL (TLS terminates at Cloudflare/NPM; the container
  # itself speaks plain ws on NB_LISTEN_ADDRESS). NB_AUTH_SECRET must match
  # the Relay.Secret in data/management.json exactly — management mints
  # time-based tokens with it that the relay verifies.
  netbird-relay:
    mem_limit: 96m
    mem_reservation: 24m
    image: netbirdio/relay:latest
    restart: unless-stopped
    ports:
      - "${NETBIRD_RELAY_PORT:-10253}:33080"
    environment:
      NB_LOG_LEVEL: info
      NB_LISTEN_ADDRESS: ":33080"
      NB_EXPOSED_ADDRESS: "rels://netbird-vpn-relay.${BASE_DOMAIN}:443"
      NB_AUTH_SECRET: "${NETBIRD_RELAY_AUTH_SECRET}"
    networks:
      - netbird-net

  # Routing peer: joins the overlay as an ordinary peer on THIS host and
  # advertises its LAN (the "My Subnet" network resource created in the
  # NetBird dashboard's Remote Network Access wizard) so a remote peer
  # reaches every device on the LAN without installing NetBird on each one.
  #
  # network_mode: host (not netbird-net) — a routing peer has to see and
  # route packets on the host's real LAN interface; an isolated Docker
  # bridge network can't provide that. NET_ADMIN + /dev/net/tun are what
  # let it create the WireGuard interface and adjust routes itself.
  netbird-client:
    mem_limit: 64m
    mem_reservation: 16m
    image: netbirdio/netbird:latest
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      NB_HOSTNAME: netbird-router
      # Same self-hosted endpoint every native client already uses — see
      # additionalExposures on netbird-vpn in backend/src/config/services.ts.
      NB_MANAGEMENT_URL: "https://netbird-vpn-api.${BASE_DOMAIN}"
      # Auto-generated by netbirdRoutingPeer.ts (backend) once
      # NETBIRD_API_TOKEN below is set — plan.md §405. Without a token,
      # paste one in by hand from the dashboard's Remote Network Access
      # wizard instead. `:-change-me` default: this container failing to
      # authenticate (and just crash-looping — restart: unless-stopped)
      # must never block the rest of netbird-vpn's compose file from
      # coming up, so this is deliberately NOT a required field.
      NB_SETUP_KEY: "${NETBIRD_ROUTING_PEER_SETUP_KEY:-change-me}"
      # Not read by this container at all — referenced here only so the
      # dashboard's generic per-app config panel surfaces the field (it
      # lists whatever a compose file substitutes; see
      # extractComposeEnvVars in backend/src/config/services.ts).
      # netbirdRoutingPeer.ts (backend) reads it straight from .env to
      # drive NetBird's management API. Same `:-change-me` reasoning as
      # NB_SETUP_KEY above — optional, never blocks a start.
      NETBIRD_API_TOKEN: "${NETBIRD_API_TOKEN:-change-me}"
    volumes:
      - ./data/client:/etc/netbird

networks:
  netbird-net:
    driver: bridge
