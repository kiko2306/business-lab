
services:
  # Bootstraps permissions on the shared tree (../nextcloud/data/shared) so
  # every consumer can write it: Samba writes as uid 1000, Nextcloud's
  # External Storage mount as www-data (uid 33). `chown` to 1000 + a world
  # write/traverse bit covers both. Replaced the old `filebrowser-init` when
  # File Browser was removed (plan.md §310); the tree now lives under
  # Nextcloud (its primary interface) but nothing in Nextcloud's own
  # entrypoint sets up that sibling dir, so Samba carries the bootstrap.
  # Docker creates a missing bind source root-owned 0755, so without this a
  # fresh deploy can't write the share.
  samba-init:
    mem_limit: 96m
    image: busybox:stable
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /storage && chmod -R o+rwX /storage"]
    restart: "no"
    volumes:
      - ../nextcloud/data/shared:/storage

  samba:
    mem_limit: 128m
    mem_reservation: 32m
    image: dockurr/samba:latest
    restart: unless-stopped
    depends_on:
      samba-init:
        condition: service_completed_successfully
    # SMB is a LAN protocol, not HTTP: it is never routed through the
    # Cloudflare Tunnel or Nginx Proxy Manager (§0 principle 1), and Windows
    # clients cannot be told to use a non-standard port. So 445 is a fixed
    # sub-10000 pin, documented in docs/ports.md like Pi-hole's 53 — the
    # allocator only renumbers compose defaults >= 10000, so it leaves this
    # one alone. `lanOnly: true` in services.ts stops the dashboard from
    # ever offering to expose it publicly.
    ports:
      - "${SAMBA_PORT:-445}:445"
    environment:
      # The dashboard creates this Samba/Unix account from these vars; the
      # share itself is defined by the generated smb.conf mounted below.
      USER: "${SAMBA_USER:-labshare}"
      PASS: "${SAMBA_PASSWORD}"
      UID: "${SAMBA_UID:-1000}"
      GID: "${SAMBA_GID:-1000}"
    labels:
      # Mandatory for the registry test (services.test.ts) even though this
      # app never gets a Home Page tile — it is LAN-only, so it is never
      # "running and exposed", which is what the generator keys a tile off.
      - "homepage.group=Files"
      - "homepage.name=Samba"
      - "homepage.icon=samba.png"
      - "homepage.description=Windows (SMB) network file share on the LAN"
      - "homepage.href=smb://home-srv-01/"
    volumes:
      # The share contents — the shared tree (plan.md §202/§219/§310), which
      # lives under Nextcloud (its primary interface, via External Storage at
      # /shared) with Paperless watching a subfolder as its consume inbox.
      # Just a browsable/writable folder with no owning app tracking file
      # identity. Permissions bootstrapped by samba-init above.
      - ../nextcloud/data/shared:/storage
      # Generated by backend/src/services/sambaConfig.ts just before every
      # start (appEnv.ts-style managed config). It MUST exist as a file before
      # `compose up` — dockur/samba's entrypoint aborts if this bind maps to a
      # directory, which is what Docker creates for a missing bind source.
      - ./data/smb.conf:/etc/samba/smb.conf:ro
