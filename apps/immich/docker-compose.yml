
services:
  immich-server:
    mem_limit: 900m
    mem_reservation: 384m
    image: ghcr.io/immich-app/immich-server:release
    restart: unless-stopped
    ports:
      - "${IMMICH_PORT:-10200}:2283"
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: ${IMMICH_DB_USER:-immich}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: ${IMMICH_DB_NAME:-immich}
      REDIS_HOSTNAME: immich-redis
      # Authelia OIDC (plan.md §270/§275). Immich has no OIDC env vars — its
      # OAuth config is a JSON file; services/immichConfig.ts writes
      # data/config/immich.json while Immich is exposed and IMMICH_CONFIG_FILE
      # is injected then. Empty here → a non-exposed start ignores it, so the
      # admin settings UI stays editable.
      IMMICH_CONFIG_FILE: ${IMMICH_CONFIG_FILE:-}
      # Not read by the container — services/immichConfig.ts reads it from .env
      # and writes it into immich.json as passwordLogin.enabled. Flip false (in
      # the Configuration panel) after a working OIDC sign-in to hide Immich's
      # own email/password form. Left true so a bad IdP can't lock you out.
      IMMICH_PASSWORD_LOGIN_ENABLED: ${IMMICH_PASSWORD_LOGIN_ENABLED:-true}
    labels:
      - "homepage.group=Media & Files"
      - "homepage.name=Immich"
      - "homepage.icon=immich.png"
      - "homepage.href=http://localhost:${IMMICH_PORT:-10200}"
      - "homepage.description=Photo and video backup with mobile auto-upload"
    volumes:
      - ./data/upload:/data
      # Managed by the dashboard: immich.json (Authelia OIDC) lands here while
      # Immich is exposed — see IMMICH_CONFIG_FILE above (§275).
      - ./data/config:/config
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_started
    networks:
      - immich-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2283/api/server/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # immich-machine-learning (face recognition + smart search) is deliberately
  # not run on this deployment — CPU/RAM-hungry (~250 MiB resident, more under
  # indexing) for two features nobody here uses. The server runs fine without
  # it; those two features just report errors. To re-enable: add the service
  # back (image ghcr.io/immich-app/immich-machine-learning:release, a
  # ./data/model-cache:/cache volume, immich-net, mem_limit: 512m) and flip
  # Machine Learning back on in Immich's admin settings. See plan.md §300 B5.

  # Major pinned to 9, matching Immich's own upstream docker-compose.yml,
  # which pins the same `valkey:9` — not an arbitrary version.
  immich-redis:
    mem_limit: 128m
    mem_reservation: 32m
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    networks:
      - immich-net

  # Immich-maintained Postgres image with the vector-search extensions it
  # requires baked in — a generic postgres image will not work here.
  immich-db:
    mem_limit: 256m
    mem_reservation: 96m
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IMMICH_DB_NAME:-immich}
      POSTGRES_USER: ${IMMICH_DB_USER:-immich}
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - immich-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IMMICH_DB_USER:-immich}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 128mb

networks:
  immich-net:
    driver: bridge
