services:
  # The 2022 image runs as the non-root `mssql` user (uid 10001); a fresh
  # clone's ./data is root-owned, so SQL Server can't create its files there.
  # One-off chown, exits 0 — same pattern as n8n-init.
  mssql-init:
    image: busybox:stable
    user: "0:0"
    command: ["chown", "-R", "10001:0", "/data"]
    restart: "no"
    volumes:
      - ./data:/data

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    depends_on:
      mssql-init:
        condition: service_completed_successfully
    # LAN / compose-network only — SQL Server's wire protocol can't go through
    # the Cloudflare Tunnel + NPM path (§0 principle 1, §121.4). Reached by
    # other apps and developer tools on the LAN.
    ports:
      - "${MSSQL_PORT:-10540}:1433"
    environment:
      # ACCEPT_EULA is deliberately NOT set here. The dashboard writes
      # ACCEPT_EULA=Y into this app's .env only after the operator accepts the
      # Microsoft SQL Server licence in the UI (§121.5 acceptance gate). Until
      # then the container exits on start, which is the intended safety.
      ACCEPT_EULA: ${ACCEPT_EULA:-}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      # Express: free edition, 10 GB max DB, ~1 GiB buffer pool, 4 cores.
      MSSQL_PID: Express
      TZ: ${TZ:-UTC}
    labels:
      # No homepage.href: SQL Server has no web UI. The name/group/icon/
      # description labels stay mandatory (services.test.ts).
      - "homepage.group=Data"
      - "homepage.name=SQL Server"
      - "homepage.icon=mssql.png"
      - "homepage.description=Microsoft SQL Server 2022 Express (LAN-only)"
    volumes:
      - ./data:/var/opt/mssql
    healthcheck:
      # sqlcmd 18 defaults to encrypting and validating the server cert; -C
      # trusts the self-signed one SQL Server generates. $$ so compose passes
      # the literal var name through to the container shell.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
