
services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      # Parsers + scenarios for Nginx Proxy Manager access logs and generic
      # HTTP attacks (path traversal, scanners, bad bots, known CVE probes).
      COLLECTIONS: "crowdsecurity/nginx crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
      # Auto-registers a bouncer named "cloudflare" with this key on startup so
      # the worker bouncer below can authenticate to the local API. Keep it in
      # sync with crowdsec_config.lapi_key in cloudflare-worker-bouncer.yaml.
      BOUNCER_KEY_cloudflare: ${CROWDSEC_BOUNCER_KEY}
      # Same mechanism for the Lua bouncer running inside Nginx Proxy Manager
      # (§119): registers a bouncer named "nginx" with this key on startup, so
      # NPM's per-request check can authenticate to the local API. The key is
      # generated into this app's .env and rendered into NPM's
      # crowdsec-bouncer/crowdsec-nginx-bouncer.conf by the dashboard backend
      # (services/crowdsecConfig.ts) — the two ends can't drift.
      BOUNCER_KEY_nginx: ${CROWDSEC_NGINX_BOUNCER_KEY}
    # So the notification-http plugin can reach ntfy's published port on the
    # host regardless of which compose-project bridge each app is on
    # (services/crowdsecConfig.ts renders the URL against this). plan.md §118.1.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Which logs to read and how to parse them.
      - ./config/acquis.yaml:/etc/crowdsec/acquis.d/npm.yaml:ro
      # profiles.yaml (alert -> decision, plus the alert notification) and the
      # notification-http config, both rendered by the dashboard backend
      # (services/crowdsecConfig.ts) from the "CrowdSec alerts" setting on each
      # start. profiles.yaml.example / notifications/http.yaml.example document
      # the shape. Gitignored.
      - ./config/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - ./config/notifications/http.yaml:/etc/crowdsec/notifications/http.yaml:ro
      # Decisions DB, downloaded blocklists, bouncer/machine registrations.
      - ./data/crowdsec:/var/lib/crowdsec/data
      # NPM writes per-proxy-host access logs to /data/logs; its compose mounts
      # ./data/app -> /data, so on the host that is ./data/app/logs (plural).
      # It was ./data/app/log here for a week — an empty dir Docker auto-created
      # at the mount — so CrowdSec parsed nothing at all (plan.md §110).
      # Read-only.
      - ../nginx-proxy-manager/data/app/logs:/var/log/npm:ro
    networks:
      - crowdsec-net
      # Lets Nginx Proxy Manager — a separate compose project — reach the local
      # API at http://crowdsec:8080 for the Lua bouncer's decision stream
      # (§119), without publishing LAPI to the host or the LAN.
      - crowdsec-lapi
    # Homepage discovers running containers by these labels. No homepage.href:
    # CrowdSec has no web UI at all, so a tile that linked somewhere would be
    # a dead end — it shows as a name and a description while it is up.
    labels:
      - "homepage.group=Security"
      - "homepage.name=CrowdSec"
      - "homepage.icon=crowdsec.png"
      - "homepage.description=Intrusion prevention — bans scanners at the edge"
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Deploys a Cloudflare Worker + KV + zone routes that block IPs CrowdSec
  # flags, at the edge. (Replaced crowdsecurity/cloudflare-bouncer, which is
  # stuck on Cloudflare's now-frozen Firewall Rules API.)
  #
  # Behind a compose profile so it doesn't start by default: as of v0.0.18 it
  # crash-loops with "Authentication error (10000)" against Cloudflare
  # API tokens that carry the newer `cfut_` prefix, even when the token has
  # full Workers/KV/Routes access (verified via curl). The config is still
  # rendered on every start (services/crowdsecConfig.ts) so this just works
  # once a classic token is usable or the bouncer is fixed:
  #   docker compose --profile edge-bouncer up -d
  cloudflare-worker-bouncer:
    image: crowdsecurity/cloudflare-worker-bouncer:latest
    profiles: ["edge-bouncer"]
    restart: unless-stopped
    depends_on:
      crowdsec:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      # Rendered by the dashboard backend (services/crowdsecConfig.ts) from the
      # stored Cloudflare settings + CROWDSEC_BOUNCER_KEY on each start, so it
      # holds a token — gitignored. cloudflare-worker-bouncer.yaml.example
      # documents the schema + the token scopes it needs.
      - ./config/cloudflare-worker-bouncer.yaml:/etc/crowdsec/bouncers/crowdsec-cloudflare-worker-bouncer.yaml:ro
    networks:
      - crowdsec-net

networks:
  crowdsec-net:
    driver: bridge
  # Shared with the nginx-proxy-manager compose project. External so both
  # projects join the same network rather than each creating its own; the
  # backend creates it before starting either (config/services.ts
  # `externalNetworks`).
  crowdsec-lapi:
    external: true
