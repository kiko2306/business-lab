
services:
  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    ports:
      - "${PAPERLESS_PORT:-10310}:8000"
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBPORT: 5432
      PAPERLESS_DBNAME: ${PAPERLESS_DB_NAME:-paperless}
      PAPERLESS_DBUSER: ${PAPERLESS_DB_USER:-paperless}
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_TIME_ZONE: ${PAPERLESS_TIME_ZONE:-UTC}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_URL: ${PAPERLESS_URL:-http://localhost:8000}
      PAPERLESS_ALLOWED_HOSTS: ${PAPERLESS_ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Set by the dashboard alongside PAPERLESS_URL when exposure is enabled;
      # without a matching trusted origin the login POST returns a bare 400.
      PAPERLESS_CSRF_TRUSTED_ORIGINS: ${PAPERLESS_CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      # Outgoing mail (share links, notifications). Injected from the
      # dashboard's global mail settings (Settings → Email) when set — the
      # backend derives PAPERLESS_EMAIL_* via services/mailEnv.ts. USE_TLS
      # (STARTTLS) and USE_SSL (implicit) are mutually exclusive, so both are
      # always set. Empty host = no mailer, as before. Document intake over
      # IMAP is configured separately in Paperless' own UI.
      PAPERLESS_EMAIL_HOST: ${PAPERLESS_EMAIL_HOST:-}
      PAPERLESS_EMAIL_PORT: ${PAPERLESS_EMAIL_PORT:-587}
      PAPERLESS_EMAIL_HOST_USER: ${PAPERLESS_EMAIL_HOST_USER:-}
      PAPERLESS_EMAIL_HOST_PASSWORD: ${PAPERLESS_EMAIL_HOST_PASSWORD:-}
      PAPERLESS_EMAIL_FROM: ${PAPERLESS_EMAIL_FROM:-}
      PAPERLESS_EMAIL_USE_TLS: ${PAPERLESS_EMAIL_USE_TLS:-true}
      PAPERLESS_EMAIL_USE_SSL: ${PAPERLESS_EMAIL_USE_SSL:-false}
      PAPERLESS_ENABLE_COMPRESSION: "true"
      PAPERLESS_TASK_WORKERS: 2
      PAPERLESS_THREADS_PER_WORKER: 1
    labels:
      - "homepage.group=Productivity"
      - "homepage.name=Paperless"
      - "homepage.icon=paperless-ngx.png"
      - "homepage.href=http://localhost:${PAPERLESS_PORT:-10310}"
      - "homepage.description=Document management system"
    volumes:
      - ./data/data:/usr/src/paperless/data
      - ./data/media:/usr/src/paperless/media
      - ./data/export:/usr/src/paperless/export
      # The shared tree's one-way drop box (plan.md §219/§224), not
      # Paperless's own ./data/consume — moving a file into
      # file-browser/data/files/to-paperless/ (visible there and over Samba)
      # is the deliberate way to file it with Paperless. Ensured to exist and
      # writable before every start by backend/src/services/paperlessDropbox.ts.
      - ../file-browser/data/files/to-paperless:/usr/src/paperless/consume
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-redis:
        condition: service_healthy
    networks:
      - paperless-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  paperless-db:
    # pgautoupgrade is a drop-in for postgres:17-alpine: same entrypoint, env
    # and config, but on start it runs `pg_upgrade --link` in place if it finds
    # an older cluster in PGDATA. Paperless-ngx logs "PostgreSQL 15 ... will no
    # longer be supported" every boot (plan.md §118.3), and stock postgres:17
    # will not open a v15 data dir, so a plain tag bump would strand the
    # database. `--link` consumes the old cluster (no rollback dir) — the
    # scheduled `pg_dump` (backup.engine=postgres for paperless) is the
    # fallback. A fresh clone has no data dir, so it just initdb's 17 with no
    # upgrade step. MIT-licensed. Matches n8n-db (plan.md §181).
    image: pgautoupgrade/pgautoupgrade:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PAPERLESS_DB_NAME:-paperless}
      POSTGRES_USER: ${PAPERLESS_DB_USER:-paperless}
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - paperless-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAPERLESS_DB_USER:-paperless}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # The one-time in-place pg_upgrade runs before postgres accepts
      # connections; suppress unhealthy during it so paperless-ngx's
      # depends_on: service_healthy doesn't bail on the upgrade boot. Normal
      # boots skip the upgrade and are ready in seconds.
      start_period: 90s

  paperless-redis:
    # Valkey, not Redis: redis:7-alpine is now RSALv2/SSPL (source-available,
    # not FOSS — docs/licences.md). Valkey is the BSD-3 community fork of
    # Redis 7.2, wire-compatible, and the Immich stack already runs it. The
    # service name stays so PAPERLESS_REDIS is unchanged.
    #
    # A fresh data dir (./data/valkey, not the old ./data/redis): Valkey 9
    # forked from Redis 7.2 and cannot load the RDB v12 file a redis:7.4 image
    # left behind. This is only a Celery broker + result backend — no durable
    # state — so starting empty just re-queues tasks. Delete the stale
    # ./data/redis on any host that ran the old image.
    #
    # Major pinned to 9, not floated: matches Immich's own upstream-pinned
    # `valkey:9` and paperless-ngx's own bundled compose, which is moving its
    # default broker to Valkey 9 too — not an arbitrary version.
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    volumes:
      - ./data/valkey:/data
    networks:
      - paperless-net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  paperless-net:
    driver: bridge
