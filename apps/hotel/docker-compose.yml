# Last checked for a newer image: 2026-09-23 - bump this date (even with
# no other change) to force a re-pull on every machine that pulls this
# commit; self-update only recreates an app whose apps/<name>/** changed
# since its last deploy, so this is what moves a `latest`-tagged image
# forward without a version-tag bump to diff against (§449).
services:
  # Owns units, guests and reservations, and is the only service the property
  # agent talks to (plan.md §623). check-in has joined this project below
  # (§641); pulse joins the same way once it is built — one compose project
  # because they share one database, which is why hotel-core exists at all
  # (§628).
  hotel-core:
    mem_limit: 256m
    mem_reservation: 64m
    build: ./api
    restart: unless-stopped
    ports:
      - "${HOTEL_CORE_PORT:-10603}:3000"
    depends_on:
      hotel-db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      DATABASE_URL: postgres://${HOTEL_DB_USER:-hotel}:${HOTEL_DB_PASSWORD}@hotel-db:5432/${HOTEL_DB_NAME:-hotel}
      # Overridden to the real https:// hostname on exposure (urlEnvKey,
      # plan.md §651) — the guest-email scheduler's link target. The
      # plain-http localhost fallback is only ever reached unexposed.
      HOTEL_CHECKIN_URL: ${HOTEL_CHECKIN_URL:-http://localhost:${HOTEL_CHECKIN_PORT:-10601}}
      HOTEL_PULSE_URL: ${HOTEL_PULSE_URL:-http://localhost:${HOTEL_PULSE_PORT:-10602}}
    networks:
      - hotel-net
    # Deliberately no homepage.* labels. The generator scans the whole compose
    # file and the last occurrence of each key wins, so labels here would be
    # silently overridden by hotel-admin's below — and the tile must open the
    # UI, not the API. Leaving them off makes that explicit rather than
    # dependent on service order.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The administration UI. Its own container rather than static files served
  # by hotel-core, so the two deploy independently — and its nginx proxies
  # /api through to hotel-core, which keeps the browser same-origin with no
  # CORS (plan.md §640). /agent is deliberately not proxied: the agent uses
  # hotel-core's own hostname, so the sync does not stop when this is down.
  hotel-admin:
    mem_limit: 128m
    mem_reservation: 32m
    build: ./admin
    restart: unless-stopped
    ports:
      - "${HOTEL_ADMIN_PORT:-10600}:80"
    depends_on:
      - hotel-core
    networks:
      - hotel-net
    labels:
      - "homepage.group=Productivity"
      - "homepage.name=Hotel"
      - "homepage.icon=mdi-bed"
      - "homepage.href=http://localhost:${HOTEL_ADMIN_PORT:-10600}"
      - "homepage.description=Online check-in, guest feedback and property administration"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The guest-facing check-in app. Own container for the same reason as
  # hotel-admin: independent deploys, and its nginx proxies `/api/` through to
  # hotel-core's `/checkin` routes, same-origin (plan.md §641). Public: a
  # guest follows an emailed link with no account, so this hostname carries no
  # Authelia gate at all (unlike hotel-core's `core` secondary).
  hotel-checkin:
    mem_limit: 128m
    mem_reservation: 32m
    build: ./checkin
    restart: unless-stopped
    ports:
      - "${HOTEL_CHECKIN_PORT:-10601}:80"
    depends_on:
      - hotel-core
    networks:
      - hotel-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The guest-facing feedback app. Same shape as hotel-checkin: own container,
  # nginx proxies `/api/` through to hotel-core's `/pulse` routes, public
  # hostname — a guest follows an emailed link with no account, so no
  # Authelia gate (plan.md §644).
  hotel-pulse:
    mem_limit: 128m
    mem_reservation: 32m
    build: ./pulse
    restart: unless-stopped
    ports:
      - "${HOTEL_PULSE_PORT:-10602}:80"
    depends_on:
      - hotel-core
    networks:
      - hotel-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  hotel-db:
    mem_limit: 256m
    mem_reservation: 64m
    # Stock postgres, not pgautoupgrade: this schema is new, so there is no
    # older cluster on disk to upgrade in place (contrast n8n, §118.3).
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HOTEL_DB_NAME:-hotel}
      POSTGRES_USER: ${HOTEL_DB_USER:-hotel}
      POSTGRES_PASSWORD: ${HOTEL_DB_PASSWORD}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    # No host port: reachable only on this compose network (§628). The
    # scheduled pg_dump reaches it through the service, not a published port.
    networks:
      - hotel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HOTEL_DB_USER:-hotel}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  hotel-net:
