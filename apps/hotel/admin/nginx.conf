server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Angular bundle, with the client-side-routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # An agent pointed at this hostname by mistake would otherwise fall
    # through to the SPA and get index.html with a **200** — which reads as
    # success and would have it silently doing nothing. Say what is wrong
    # instead. The agent's address is hotel-core's own hostname.
    location /agent {
        default_type application/json;
        return 404 '{"error":"the agent endpoint is on the hotel-core hostname, not this one"}';
    }

    # index.html names the current hashed bundles but had no Cache-Control, so
    # browsers cached it heuristically and kept opening an old build after a
    # deploy (plan.md §700). `try_files`' fallback re-enters location matching,
    # so this covers `/` and every SPA route. No add_header: a location with
    # its own drops the inherited server-level ones.
    location = /index.html {
        expires -1;
    }

    # hotel-core, reached over the compose network.
    #
    # Proxied rather than called cross-origin from the browser: the API is a
    # different container, but going through here keeps it same-origin, so
    # there is no CORS to configure and no question about whether the Authelia
    # session cookie travels (plan.md §640).
    #
    # `/agent` is deliberately NOT proxied. The agent reaches hotel-core on its
    # own hostname, so the sync — the critical path — does not stop when this
    # frontend container is down.
    location /api/ {
        proxy_pass http://hotel-core:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authelia's forwarded identity is what hotel-core authenticates on
        # (§629); dropping these would 401 every admin request.
        proxy_set_header Remote-User $http_remote_user;
        proxy_set_header Remote-Groups $http_remote_groups;
        proxy_set_header Remote-Name $http_remote_name;
        proxy_set_header Remote-Email $http_remote_email;
    }
}
