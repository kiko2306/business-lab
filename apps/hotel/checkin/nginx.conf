server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Angular bundle. Client-side routing needs the SPA fallback, but
    # there is no router here (plan.md §641) — the guest's own path, e.g.
    # `/<token>`, is read straight off `location.pathname` in the component,
    # so `/index.html` just needs to be served for anything that isn't a
    # real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hotel-core, reached over the compose network — proxied so the browser
    # stays same-origin (no CORS to configure) even though it is a different
    # container (plan.md §640's reasoning, applied here too). The prefix is
    # rewritten: hotel-core's guest routes are mounted at `/checkin`, not
    # `/api` (plan.md §641), and there is no session cookie to forward here —
    # the token in the path is the whole of the guest's authorisation.
    location /api/ {
        proxy_pass http://hotel-core:3000/checkin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
