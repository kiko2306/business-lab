<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Tally</title>
    <base href="/" />
    <!-- viewport-fit=cover lets the app run edge to edge under a notch when installed;
         styles.css pads the safe areas back in. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#26303f" />
    <!-- use-credentials: the manifest is behind Authelia, and a plain <link> fetches it
         without cookies, so it would get the login redirect and install would never offer. -->
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
