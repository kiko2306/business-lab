###############################################################
#                   Authelia configuration                    #
###############################################################
# Minimal starter config: file-based users, SQLite storage, filesystem
# notifier (no SMTP server required to get running). Session/storage/JWT
# secrets are injected via the AUTHELIA_* environment variables in this app's
# .env — see .env.example.
#
# Review https://www.authelia.com/configuration/ before exposing this beyond
# your LAN: at minimum, update the session cookie domain/URLs below to match
# how you'll actually reach Authelia and the apps it's protecting.

theme: light

server:
  address: 'tcp://:9091'

log:
  level: info

totp:
  issuer: 'authelia.local'

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: one_factor

session:
  cookies:
    # Authelia's own listener stays plain HTTP (server.address above) — NPM /
    # Cloudflare Tunnel terminate TLS in front of it, same as every other app
    # in apps/*/, and that public HTTPS hostname is what these need to match.
    # If your setup doesn't already expose Authelia at this hostname via the
    # dashboard's Exposure settings, update this to whatever domain it will
    # actually be reachable at first.
    - domain: '{{ env "BASE_DOMAIN" }}'
      authelia_url: 'https://authelia.{{ env "BASE_DOMAIN" }}'
      default_redirection_url: 'https://netbird-vpn.{{ env "BASE_DOMAIN" }}'

storage:
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt

# OIDC provider — lets other apps (currently: NetBird VPN's management
# service, see apps/netbird-vpn/) authenticate against Authelia instead of
# rolling their own login. hmac_secret comes from AUTHELIA_OIDC_HMAC_SECRET
# in .env; the JWKS signing key is generated to data/oidc-jwks.pem (gitignored
# — see .env.example for the generation command) rather than checked in here.
#
# Both clients below are "public" (no client_secret) since NetBird's
# dashboard (PKCE) and CLI (device code) are exactly the kind of clients
# that can't safely hold a static secret. redirect_uris point at NetBird's
# real exposed hostname (netbird-vpn.<base domain>).
#
# Every hostname here is templated from the BASE_DOMAIN environment variable
# rather than hardcoded, so a new deployment on a different domain needs no
# edits to this file. That requires the `template` config filter, which
# docker-compose.yml enables via --config.experimental.filters; without it
# Authelia reads the template expressions as literal text and fails validation
# with "could not decode ... to a *url.URL". BASE_DOMAIN is written into this
# app's .env by start.sh.
#
# Note the filter templates this whole file, comments included — so don't write
# a literal template action anywhere here, even inside a comment, or Authelia
# fails to start on a parse error.
#
# The jwks signing key itself is NOT in this file: Authelia's config schema
# doesn't support a key_file reference or env-var override for it (jwks is a
# list, same restriction as clients below), so the actual PEM content has to
# live inline in YAML — which would mean committing a private key to git.
# Instead it's merged in at startup from data/oidc-secrets.yml — gitignored,
# generated once by `openssl genrsa`, never checked in. See docker-compose.yml
# (the "--config" arg lists both files) and .env.example for the exact command.
identity_providers:
  oidc:
    # Without this, Authelia sends no Access-Control-Allow-Origin on OIDC
    # endpoints at all — a public/SPA client doing the token exchange
    # directly from the browser (like NetBird's dashboard) gets a CORS
    # failure even though the request succeeds server-side (NPM/Authelia
    # both log 200; the browser's fetch() throws "Failed to fetch" anyway
    # because the response lacks the header it requires). Deriving allowed
    # origins from each client's own redirect_uris keeps this in sync
    # automatically instead of listing origins twice.
    cors:
      endpoints:
        - 'token'
        - 'authorization'
        - 'userinfo'
        - 'revocation'
        - 'introspection'
      allowed_origins_from_client_redirect_uris: true
    clients:
      - client_id: 'netbird-dashboard'
        client_name: 'NetBird Dashboard'
        public: true
        authorization_policy: 'one_factor'
        # 'implicit' never actually skips the consent screen for a client
        # requesting offline_access (Authelia requires a real consent
        # decision to mint a refresh token regardless of consent_mode — see
        # https://github.com/authelia/authelia/discussions/10668). Since the
        # dashboard's silent-renew iframe also can't work at all here
        # (Authelia sends X-Frame-Options: DENY / frame-ancestors 'none' by
        # design, so /nb-silent-auth's hidden iframe always fails to load),
        # every renewal was falling back to a full top-level redirect that
        # hit a fresh, un-skippable consent prompt — looked like the
        # dashboard "loading then bouncing back to login" on a ~10-15s
        # cycle. 'pre-configured' remembers the grant after the first real
        # accept, so the top-level fallback redirect completes silently
        # (302 straight through, no visible consent page) instead.
        consent_mode: 'pre-configured'
        # NetBird's PKCEAuthorizationFlow sends this as the OIDC `audience`
        # parameter (see apps/netbird-vpn/data/management.json) — Authelia
        # rejects any audience the client hasn't explicitly whitelisted.
        audience:
          - 'netbird-dashboard'
        redirect_uris:
          - 'https://netbird-vpn.{{ env "BASE_DOMAIN" }}/nb-auth'
          - 'https://netbird-vpn.{{ env "BASE_DOMAIN" }}/nb-silent-auth'
          # Native clients (Android/desktop/CLI) reuse this same public PKCE
          # client — they can't use the two web URLs above, because the app
          # runs a throwaway loopback listener and expects the authorization
          # code delivered back to it there (RFC 8252). Reusing this client
          # rather than netbird-cli is deliberate: management validates the
          # bearer's audience against HttpConfig.AuthAudience, which is
          # 'netbird-dashboard', so a token minted for a different client_id
          # would be rejected. Both slash variants are registered because
          # Authelia matches redirect_uri by exact string.
          # See PKCEAuthorizationFlow in apps/netbird-vpn/data/management.json.
          - 'http://localhost:53000/'
          - 'http://localhost:53000'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'offline_access'
        grant_types:
          - 'authorization_code'
          - 'refresh_token'
          # Native clients (desktop / headless CLI) that can't run the
          # loopback listener fall back to the OAuth device-code grant, and
          # NetBird's DeviceAuthorizationFlow is pointed at THIS client (not a
          # separate netbird-cli) for the same reason the loopback redirect
          # is: management validates the bearer's audience against
          # HttpConfig.AuthAudience = 'netbird-dashboard', so the token has to
          # be minted for this client_id. The device flow sends the id_token
          # as the bearer (UseIDToken:true in management.json) because the
          # access token Authelia issues for a public client is opaque and
          # management validates it locally as a JWT.
          - 'urn:ietf:params:oauth:grant-type:device_code'
        response_types:
          - 'code'
        token_endpoint_auth_method: 'none'
        require_pkce: true
        pkce_challenge_method: 'S256'
