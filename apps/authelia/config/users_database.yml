# Generate a real password hash before going anywhere near production:
#   docker run --rm authelia/authelia:latest authelia crypto hash generate argon2 --password 'yourpassword'
# then replace the example entry below (or add more users).

users:
  authelia:
    disabled: false
    displayname: 'Authelia Admin'
    # Placeholder hash for the password "authelia" — CHANGE THIS.
    password: '$argon2id$v=19$m=65536,t=3,p=4$BpLnfgDsc2WD8F2q$o/vzA4myCqZZ36bUGsDY//8mKUYNZZaR0t4MFFSs+iM'
    email: admin@localhost
    groups:
      - admins
