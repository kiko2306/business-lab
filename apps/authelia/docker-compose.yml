
services:
  authelia:
    image: authelia/authelia:latest
    restart: unless-stopped
    # Two config files merged: the tracked configuration.yml plus the
    # gitignored data/oidc-secrets.yml holding the actual OIDC signing key
    # (see the identity_providers comment in configuration.yml for why it's
    # split out like this).
    command: ["--config", "/config/configuration.yml,/data/oidc-secrets.yml"]
    ports:
      - "${AUTHELIA_PORT:-9091}:9091"
    environment:
      TZ: ${TZ:-UTC}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET: ${AUTHELIA_OIDC_HMAC_SECRET}
    labels:
      - "homepage.group=Security"
      - "homepage.name=Authelia"
      - "homepage.icon=authelia.png"
      - "homepage.href=http://localhost:${AUTHELIA_PORT:-9091}"
      - "homepage.description=Single sign-on and 2FA gateway"
    volumes:
      - ./config:/config:ro
      - ./data:/data
    healthcheck:
      test: ["CMD", "authelia", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
