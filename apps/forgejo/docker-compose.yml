services:
  forgejo:
    mem_limit: 512m
    mem_reservation: 128m
    # Pinned to the current stable major (16.x, Sept 2026). Forgejo ships a
    # major roughly quarterly and only the pinned major tag stays on a
    # release line — `:latest` would jump majors with no notice, which a
    # client box must not do. Bump this deliberately.
    image: codeberg.org/forgejo/forgejo:16
    restart: unless-stopped
    environment:
      # The image runs as root under s6 then drops to this uid/gid and chowns
      # /data on first run — matches the dashboard's own non-root file owner.
      USER_UID: 1000
      USER_GID: 1000
      TZ: ${TZ:-UTC}
      # app.ini is generated from these FORGEJO__section__KEY vars on first
      # start. INSTALL_LOCK skips the web installer since the config is
      # supplied here. SQLite keeps this a single container — fine for a small
      # team; a busy instance would move to Postgres (a second container).
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      # ROOT_URL / DOMAIN follow the public hostname once exposure is enabled
      # (exposureEnvKeys) so clone URLs, webhooks and OAuth callbacks are
      # right; empty otherwise, which makes Forgejo derive them per request.
      FORGEJO__server__ROOT_URL: ${FORGEJO_ROOT_URL:-}
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN:-}
      # SSH git access is LAN/VPN only — the Cloudflare Tunnel carries HTTP,
      # not SSH (principle 1: no router forwarding). SSH_PORT is the host port
      # advertised in ssh:// clone URLs; SSH_LISTEN_PORT is the container port
      # published below.
      FORGEJO__server__SSH_PORT: ${FORGEJO_SSH_PORT:-10561}
      FORGEJO__server__SSH_LISTEN_PORT: "22"
      # First account registered becomes the admin. Turn this on from the
      # Configuration panel once it exists so the forge isn't open to sign-ups.
      FORGEJO__service__DISABLE_REGISTRATION: ${FORGEJO_DISABLE_REGISTRATION:-false}
    ports:
      - "${FORGEJO_PORT:-10560}:3000"
      - "${FORGEJO_SSH_PORT:-10561}:22"
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "homepage.group=Development"
      - "homepage.name=Forgejo"
      - "homepage.icon=forgejo.png"
      - "homepage.href=http://localhost:${FORGEJO_PORT:-10560}"
      - "homepage.description=Self-hosted Git forge with CI"
    healthcheck:
      # /api/healthz is unauthenticated and returns 200 once migrations are
      # done. busybox wget (Alpine base), IPv4 loopback — Forgejo binds
      # 0.0.0.0. start_period is generous: a first run migrates ~300 SQLite
      # tables.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
