
# Last checked for a newer image: 2026-09-28 (0.63.2 -> 0.64.2; 0.64.1 is a
# five-CVE security release, §738) - bump this date (even with
# no other change) to force a re-pull on every machine that pulls this
# commit; self-update only recreates an app whose apps/<name>/** changed
# since its last deploy, so this is what moves a `latest`-tagged image
# forward without a version-tag bump to diff against (§449).
services:
  navidrome:
    # Go binary + a small Alpine userland for ffmpeg; audio-only, no transcoding
    # of video, so it sits happily in a fraction of Jellyfin's footprint. The
    # ceiling mostly covers an ffmpeg transcode or two during a library scan.
    mem_limit: 256m
    mem_reservation: 64m
    # 0.64.0's migration re-encodes every internal ID (upstream says back up
    # first); taken anyway because 0.64.1 fixes five advisories, including
    # Subsonic auth and per-user library filtering, on a publicly exposed app.
    image: deluan/navidrome:0.64.2
    restart: unless-stopped
    ports:
      - "${NAVIDROME_PORT:-10570}:4533"
    environment:
      TZ: ${TZ:-UTC}
      # NOT read by Navidrome — a carrier so the dashboard's config panel
      # shows the field and auto-generates a value. The backend uses it to
      # create the first admin (services/navidromeAdminBootstrap.ts):
      # Navidrome has no OIDC, so its own login is the only gate.
      NAVIDROME_ADMIN_PASSWORD: ${NAVIDROME_ADMIN_PASSWORD:-}
      ND_DATAFOLDER: /data
      ND_MUSICFOLDER: /music
      # Navidrome builds absolute URLs (share links, the PWA manifest, Subsonic
      # API base) from the X-Forwarded-* headers NPM sends, so exposing it at
      # the root of a hostname needs no host/URL setting. ND_BASEURL is only for
      # serving under a sub-path, which the dashboard never does.
      ND_BASEURL: ""
      # Sign in through Authelia (plan.md §749): NPM's authelia-authrequest.conf
      # overwrites Remote-User on every request — empty on the /rest bypass, so
      # a client-sent copy never survives it — and Navidrome trusts it only from
      # these Docker bridge ranges (setup_server.sh's 10.201.0.0/16 pool plus the
      # stock ones; NPM reaches the published port via the bridge gateway).
      # A LAN client hitting the port directly keeps its own source address, is
      # not whitelisted, and gets Navidrome's normal login instead.
      ND_REVERSEPROXYUSERHEADER: Remote-User
      ND_REVERSEPROXYWHITELIST: 10.201.0.0/16,172.17.0.0/16,172.31.0.0/16
    labels:
      - "homepage.group=Media & Files"
      - "homepage.name=Navidrome"
      - "homepage.icon=navidrome.png"
      - "homepage.href=http://localhost:${NAVIDROME_PORT:-10570}"
      - "homepage.description=Music streaming server (Subsonic-compatible)"
    volumes:
      - ./data:/data
      # `music/` in the shared tree Samba serves, so files dropped over SMB
      # show up here. Created by sharedFolders.ts before every start.
      # Read-only: Navidrome never writes to the library, only its own /data.
      - ../nextcloud/data/shared/music:/music:ro
    healthcheck:
      # /ping is unauthenticated and returns a small JSON body.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:4533/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
