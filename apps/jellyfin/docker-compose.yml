
# Last checked for a newer image: 2026-09-16 - bump this date (even with
# no other change) to force a re-pull on every machine that pulls this
# commit; self-update only recreates an app whose apps/<name>/** changed
# since its last deploy, so this is what moves a `latest`-tagged image
# forward without a version-tag bump to diff against (§449).
services:
  jellyfin:
    mem_limit: 768m
    mem_reservation: 192m
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    ports:
      - "${JELLYFIN_PORT:-10210}:8096"
    environment:
      TZ: ${TZ:-UTC}
      # NOT read by Jellyfin — a carrier so the dashboard's config panel shows
      # the field and auto-generates a value. The backend uses it to run
      # Jellyfin's first-run startup wizard
      # (services/jellyfinAdminBootstrap.ts): Jellyfin has no OIDC and is
      # lanOnly, so its own login is the only gate.
      JELLYFIN_ADMIN_PASSWORD: ${JELLYFIN_ADMIN_PASSWORD:-}
    labels:
      - "homepage.group=Media & Files"
      - "homepage.name=Jellyfin"
      - "homepage.icon=jellyfin.png"
      - "homepage.href=http://localhost:${JELLYFIN_PORT:-10210}"
      - "homepage.description=Home media server"
    volumes:
      - ./data/config:/config
      - ./data/cache:/cache
      # `media/` in the shared tree Samba serves, so files dropped over SMB
      # show up here. Created by sharedFolders.ts before every start.
      - ../nextcloud/data/shared/media:/media:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
