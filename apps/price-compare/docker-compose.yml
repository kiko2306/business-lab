services:
  price-compare:
    build: ./app
    restart: unless-stopped
    ports:
      - "${PRICE_COMPARE_PORT:-8015}:3000"
    environment:
      # Defaults to Portugal specifically (not UTC like the dashboard-wide
      # default) — this app's daily scheduled update (server.js) fires at
      # 08:00 in whatever TZ the process sees, and every store it scrapes
      # is Portuguese, so "8am" should mean 8am in Portugal regardless of
      # what timezone the host itself runs in.
      TZ: ${TZ:-Europe/Lisbon}
      # Standalone Google Sign-In (apps/price-compare/app/auth.js) — each
      # Google account that signs in becomes its own user automatically,
      # each only ever seeing their own products. See .env.example for how
      # to get these from Google Cloud Console. The app boots fine without
      # them set; /auth/google just returns 503 until they're configured.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # Web Push (push.js) — notifies a user when a tracked product's price
      # drops 10%+ at any store. See .env.example for how to generate a
      # VAPID keypair. The app boots fine without them; the notification
      # opt-in popup just stays hidden until they're configured.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      # Single products.json file — same reasoning as apps/pantry: small
      # dataset, no real database needed. Now multi-user (each product
      # carries a userId), still just one flat JSON file.
      - ./data:/data
    labels:
      - "homepage.group=Productivity"
      - "homepage.name=Price Compare"
      - "homepage.icon=mdi-cart-outline.png"
      - "homepage.href=http://localhost:${PRICE_COMPARE_PORT:-8015}"
      - "homepage.description=Compare grocery prices across Continente, Pingo Doce, Lidl, Recheio, Makro"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
