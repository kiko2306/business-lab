services:
  price-compare:
    build: ./app
    restart: unless-stopped
    ports:
      - "${PRICE_COMPARE_PORT:-8015}:3000"
    environment:
      # Defaults to Portugal specifically (not UTC like the dashboard-wide
      # default) — this app's daily scheduled update (server.js) fires at
      # 08:00 in whatever TZ the process sees, and every store it scrapes
      # is Portuguese, so "8am" should mean 8am in Portugal regardless of
      # what timezone the host itself runs in.
      TZ: ${TZ:-Europe/Lisbon}
    volumes:
      # Single products.json file — same reasoning as apps/pantry: small,
      # single-user dataset, no real database needed.
      - ./data:/data
    labels:
      - "homepage.group=Productivity"
      - "homepage.name=Price Compare"
      - "homepage.icon=mdi-cart-outline.png"
      - "homepage.href=http://localhost:${PRICE_COMPARE_PORT:-8015}"
      - "homepage.description=Compare grocery prices across Continente, Pingo Doce, Lidl, Recheio, Makro"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
