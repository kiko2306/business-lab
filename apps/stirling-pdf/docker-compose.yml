
services:
  stirling-pdf:
    mem_limit: 1g
    mem_reservation: 320m
    # ultra-lite, not the full image: the full tag bundles a LibreOffice +
    # Tesseract-OCR + Python runtime that sit resident (~960 MiB RSS, 3.4 GB
    # on disk) for the Office-doc conversion and OCR tools. This deployment
    # doesn't use those (Paperless does its own OCR, Nextcloud edits via
    # OnlyOffice), and ultra-lite keeps every core PDF operation — merge,
    # split, rotate, watermark, sign, compress, metadata — at ~200 MiB / 0.9
    # GB (plan.md §300 B1). Switch back to `:latest` if Office/OCR is wanted.
    image: stirlingtools/stirling-pdf:latest-ultra-lite
    restart: unless-stopped
    ports:
      - "${STIRLING_PDF_PORT:-10360}:8080"
    environment:
      TZ: ${TZ:-UTC}
      # Cap the JVM heap so the container stays under mem_limit above. The
      # image (JDK 25, Spring Boot) sets no -Xmx and would size the heap to a
      # percentage of the *cgroup* limit — with the 1g mem_limit that leaves
      # too little for metaspace/threads/direct buffers under PDF load, and
      # the image runs -XX:+ExitOnOutOfMemoryError. -Xmx640m + ~360m non-heap
      # fits 1g. JAVA_TOOL_OPTIONS is read by the JVM unconditionally (the
      # launcher is a bare `java -jar`, so JAVA_CUSTOM_OPTS may not apply).
      JAVA_TOOL_OPTIONS: "-Xmx640m"
      # All processing is local; no login by default. Flip to true (and add
      # users via the UI) to gate access — but exposure should go through
      # Authelia rather than relying on this.
      DOCKER_ENABLE_SECURITY: ${STIRLING_PDF_ENABLE_SECURITY:-false}
      SECURITY_ENABLELOGIN: ${STIRLING_PDF_ENABLE_LOGIN:-false}
      LANGS: ${STIRLING_PDF_LANGS:-en_GB}
      SYSTEM_DEFAULTLOCALE: ${STIRLING_PDF_LOCALE:-en-US}
    labels:
      - "homepage.group=Files"
      - "homepage.name=Stirling-PDF"
      - "homepage.icon=stirling-pdf.png"
      - "homepage.href=http://localhost:${STIRLING_PDF_PORT:-10360}"
      - "homepage.description=Local PDF toolkit (merge, split, rotate, sign, compress)"
    volumes:
      # OCR language packs, custom app config, uploaded custom files, pipelines.
      - ./data/tessdata:/usr/share/tessdata
      - ./data/configs:/configs
      - ./data/customFiles:/customFiles
      - ./data/pipeline:/pipeline
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/info/status | grep -q 'UP' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
