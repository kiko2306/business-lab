
services:
  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    restart: unless-stopped
    ports:
      - "${DUPLICATI_PORT:-10150}:8200"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      SETTINGS_ENCRYPTION_KEY: ${DUPLICATI_SETTINGS_ENCRYPTION_KEY}
      DUPLICATI__WEBSERVICE_PASSWORD: ${DUPLICATI_WEB_PASSWORD}
      # Duplicati 2.x rejects requests whose Host header isn't allow-listed;
      # the dashboard sets this to "*" when exposure is enabled (the web UI
      # still has its own password / optional Authelia in front).
      DUPLICATI__WEBSERVICE_ALLOWEDHOSTNAMES: ${DUPLICATI__WEBSERVICE_ALLOWEDHOSTNAMES:-*}
    labels:
      - "homepage.group=Monitoring & Backup"
      - "homepage.name=Duplicati"
      - "homepage.icon=duplicati.png"
      - "homepage.href=http://localhost:${DUPLICATI_PORT:-10150}"
      - "homepage.description=Encrypted offsite/cloud backup"
    volumes:
      - ./data/config:/config
      - ./data/backups:/backups
      # The managed apps/ tree (per-app data + .env) mounted read-only as a
      # backup source, so Duplicati has something to back up out of the box.
      # APPS_DIR is the absolute host path when the dashboard starts this;
      # falls back to this compose file's own apps/ parent otherwise.
      - ${APPS_DIR:-../}:/source/apps:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
