services:
  kopia:
    image: kopia/kopia:latest
    restart: unless-stopped
    # Kopia identifies every snapshot source by (user, host, path). The host
    # defaults to the container's hostname, which Docker sets to the container
    # ID — so a `--force-recreate` (an image update) would orphan every
    # existing snapshot under the old ID. Pin it so snapshot history survives
    # a recreate.
    hostname: kopia
    # The stock image entrypoint is `kopia` itself. entrypoint.sh connects (or,
    # first time, creates) the filesystem repository before handing off to
    # `kopia server start` — Kopia has no create-if-missing server mode.
    entrypoint: /entrypoint.sh
    ports:
      - "${KOPIA_PORT:-10470}:51515"
    environment:
      TZ: ${TZ:-UTC}
      # Repository encryption password. Generated by the dashboard. The image
      # sets KOPIA_PERSIST_CREDENTIALS_ON_CONNECT=false, so this is never
      # written to ./data/config and must be supplied here every start.
      KOPIA_PASSWORD: ${KOPIA_PASSWORD}
      # Fixed username for the web UI / REST API basic auth; the passwords
      # carry the security. KOPIA_SERVER_PASSWORD gates the UI and REST API,
      # KOPIA_SERVER_CONTROL_PASSWORD the control API that `kopia server`
      # management commands use. Both generated by the dashboard.
      KOPIA_SERVER_USERNAME: kopia
      KOPIA_SERVER_PASSWORD: ${KOPIA_SERVER_PASSWORD}
      KOPIA_SERVER_CONTROL_PASSWORD: ${KOPIA_SERVER_CONTROL_PASSWORD}
    labels:
      - "homepage.group=Monitoring & Backup"
      - "homepage.name=Kopia"
      - "homepage.icon=kopia.png"
      - "homepage.href=http://localhost:${KOPIA_PORT:-10470}"
      - "homepage.description=Fast encrypted snapshot backup"
    volumes:
      - ./entrypoint.sh:/entrypoint.sh:ro
      # Kopia's config (repository.config), local cache and logs. Paths are
      # fixed by the image via KOPIA_CONFIG_PATH / KOPIA_CACHE_DIRECTORY /
      # KOPIA_LOG_DIR — do not remap them without matching those.
      - ./data/config:/app/config
      - ./data/cache:/app/cache
      - ./data/logs:/app/logs
      # Where the Kopia repository lives. The dashboard's Backup destination
      # (Settings) is translated into a three-option local-driver volume by
      # services/kopiaTargetApply.ts and written to this app's .env. The
      # default is a local directory — on the SAME DISK as the data it
      # protects, so set a real destination before relying on it. Only
      # disk/SMB/NFS are supported today; a Kopia-native remote (S3/B2/SFTP/
      # gdrive) is a separate, still-open task (plan.md §194).
      - backup-target:/repository
      # The managed apps/ tree (per-app data + .env) mounted read-only as the
      # backup source, so Kopia has something to snapshot out of the box.
      # APPS_DIR is the absolute host path when the dashboard starts this;
      # falls back to this compose file's own apps/ parent otherwise.
      - ${APPS_DIR:-../}:/source/apps:ro
    healthcheck:
      # The server puts the UI and the API behind basic auth, so an
      # unauthenticated probe always 401s; check with the generated
      # credentials instead. curl ships in the image.
      test:
        - "CMD-SHELL"
        - "curl -fsS -o /dev/null -u \"$$KOPIA_SERVER_USERNAME:$$KOPIA_SERVER_PASSWORD\" http://localhost:51515/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  # One templated volume whose three local-driver options serve a bind, an
  # NFS export or an SMB share. Written by services/kopiaTargetApply.ts from
  # the dashboard's Backup destination; the default keeps the repository in
  # this app's own data dir.
  backup-target:
    driver: local
    driver_opts:
      type: ${BACKUP_MOUNT_TYPE:-none}
      o: ${BACKUP_MOUNT_OPTIONS:-bind}
      device: ${BACKUP_MOUNT_DEVICE:-./data/repository}
