
services:
  ntfy:
    mem_limit: 96m
    mem_reservation: 24m
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: serve
    ports:
      - "${NTFY_PORT:-10290}:80"
    environment:
      TZ: ${TZ:-UTC}
      # ntfy builds the web app's base href, notification click links and
      # attachment URLs from this — the dashboard rewrites it to the public
      # https:// hostname once exposure is enabled.
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:8010}
      # Only trust X-Forwarded-For when ntfy is actually reached through the
      # reverse proxy; the dashboard flips this to true with exposure. Left on
      # for direct LAN access it would let clients spoof their visitor IP.
      NTFY_BEHIND_PROXY: ${NTFY_BEHIND_PROXY:-false}
      # Persist messages / subscriptions across restarts (default is in-memory).
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      # ntfy's own access control (plan.md §425). `write-only` is the whole
      # trick: anyone may PUBLISH anonymously, nobody may READ without a
      # token. That is the right way round here —
      #   * publishing is internal only (CrowdSec -> n8n -> ntfy and the
      #     backend's publishAlert(), both over the host port, never through
      #     the tunnel), and POST /<topic> is NOT in ntfy's Authelia bypass,
      #     so it stays gated from outside;
      #   * reading is what needed protecting: the alert stream carries
      #     attacker IPs from CrowdSec, and ntfy topics are publish-by-name.
      # It also means the bypass that lets the ntfy phone app subscribe
      # (autheliaBypassPaths on ntfy in backend/src/config/services.ts)
      # cannot expose anything — ntfy itself demands a token to read.
      NTFY_AUTH_FILE: /var/cache/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: write-only
      # NOT read by ntfy — a carrier so the dashboard's config panel shows the
      # token. Minted by services/ntfyAuthBootstrap.ts with `ntfy token add`
      # against a read-only `subscriber` user; paste it into the ntfy phone or
      # desktop app (Settings -> add the topic -> "Login/token") to subscribe
      # now that anonymous reads are denied.
      NTFY_SUBSCRIBE_TOKEN: ${NTFY_SUBSCRIBE_TOKEN:-}
      # The same read-only account's password. The Android/iOS apps ask for a
      # username and password ("Manage users" per ntfy's own docs), not a
      # token — storing only the token left the phone with nothing to enter
      # and ntfy answering 403 (§428). Username is `subscriber`.
      NTFY_SUBSCRIBE_PASSWORD: ${NTFY_SUBSCRIBE_PASSWORD:-}
    labels:
      - "homepage.group=Monitoring & Backup"
      - "homepage.name=ntfy"
      - "homepage.icon=ntfy.png"
      - "homepage.href=http://localhost:${NTFY_PORT:-10290}"
      - "homepage.description=Push notifications to phone and desktop"
    volumes:
      - ./data:/var/cache/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://localhost:80/v1/health | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
