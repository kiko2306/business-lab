# Last checked for a newer image: 2026-09-24 - bump this date (even with
# no other change) to force a re-pull on every machine that pulls this
# commit; self-update only recreates an app whose apps/<name>/** changed
# since its last deploy, so this is what moves a `latest`-tagged image
# forward without a version-tag bump to diff against (§449).
services:
  # Outline runs as uid 1001 (image-baked `nodejs` user) and its attachment
  # store is a bind mount, which Docker creates root-owned on a fresh clone —
  # without this, every upload 500s with EACCES. One-off chown before the app
  # starts; exits 0 (same shape as vikunja-init).
  outline-init:
    mem_limit: 96m
    image: busybox:stable
    user: "0:0"
    command: ["chown", "-R", "1001:1001", "/data"]
    restart: "no"
    volumes:
      - ./data/storage:/data

  outline:
    mem_limit: 900m
    mem_reservation: 384m
    image: outlinewiki/outline:latest
    restart: unless-stopped
    ports:
      - "${OUTLINE_PORT:-10620}:3000"
    environment:
      # Outline builds every link, cookie and OIDC redirect from this, so it
      # has to be the public URL once exposed (injected by the exposure system).
      URL: ${OUTLINE_URL:-http://localhost:10620}
      PORT: 3000
      # Both are 64 hex chars, generated by the dashboard on first start.
      # SECRET_KEY signs sessions and encrypts stored tokens — losing it logs
      # everyone out and breaks integrations, so it is shown for backup.
      SECRET_KEY: ${OUTLINE_SECRET_KEY}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET}
      DATABASE_URL: postgres://${OUTLINE_DB_USER:-outline}:${OUTLINE_DB_PASSWORD}@outline-db:5432/${OUTLINE_DB_NAME:-outline}
      # Same-project bridge network, no TLS on the Postgres side.
      PGSSLMODE: disable
      REDIS_URL: redis://outline-redis:6379
      # TLS ends at Cloudflare/NPM; left at its default (true) Outline would
      # 301 every plain-http request to https, including the LAN port.
      FORCE_HTTPS: "false"
      # One Node worker is plenty for a small team and keeps the footprint
      # inside mem_limit (the default forks one per CPU core).
      WEB_CONCURRENCY: 1
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      # Authelia OIDC. Outline has no local login at all, so this is the only
      # way in; all blank until the exposure system injects them from the
      # registered client (services.ts `oidcClient`), and Outline shows no
      # sign-in provider until then.
      OIDC_CLIENT_ID: ${OUTLINE_OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OUTLINE_OIDC_CLIENT_SECRET:-}
      OIDC_AUTH_URI: ${OUTLINE_OIDC_AUTH_URI:-}
      OIDC_TOKEN_URI: ${OUTLINE_OIDC_TOKEN_URI:-}
      OIDC_USERINFO_URI: ${OUTLINE_OIDC_USERINFO_URI:-}
      OIDC_LOGOUT_URI: ${OUTLINE_OIDC_LOGOUT_URI:-}
      OIDC_USERNAME_CLAIM: ${OUTLINE_OIDC_USERNAME_CLAIM:-preferred_username}
      OIDC_DISPLAY_NAME: ${OUTLINE_OIDC_DISPLAY_NAME:-Authelia}
      OIDC_SCOPES: ${OUTLINE_OIDC_SCOPES:-openid profile email}
    labels:
      - "homepage.group=Productivity"
      - "homepage.name=Outline"
      - "homepage.icon=outline.png"
      - "homepage.href=http://localhost:${OUTLINE_PORT:-10620}"
      - "homepage.description=Team wiki and knowledge base"
    volumes:
      - ./data/storage:/var/lib/outline/data
    depends_on:
      outline-init:
        condition: service_completed_successfully
      outline-db:
        condition: service_healthy
      outline-redis:
        condition: service_healthy
    networks:
      - outline-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/_health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # First boot runs every DB migration before the server listens.
      start_period: 120s

  outline-db:
    # Drop-in for postgres:16-alpine that pg_upgrades in place on a major bump
    # (same choice as twenty-db / n8n-db). Outline migrates forward-only on
    # boot, so the scheduled pg_dump (backup.engine=postgres) is the fallback.
    image: pgautoupgrade/pgautoupgrade:16-alpine
    mem_limit: 256m
    mem_reservation: 96m
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OUTLINE_DB_NAME:-outline}
      POSTGRES_USER: ${OUTLINE_DB_USER:-outline}
      POSTGRES_PASSWORD: ${OUTLINE_DB_PASSWORD}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - outline-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OUTLINE_DB_USER:-outline}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  outline-redis:
    # Valkey, not Redis: redis:7+ is RSALv2/SSPL (docs/licences.md). Outline
    # only uses it for its job queue and websocket pub/sub, so no persistence
    # volume — nothing in it needs to survive a restart.
    image: docker.io/valkey/valkey:9-alpine
    mem_limit: 128m
    mem_reservation: 32m
    restart: unless-stopped
    command: ["--maxmemory-policy", "noeviction", "--save", ""]
    networks:
      - outline-net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  outline-net:
    driver: bridge
