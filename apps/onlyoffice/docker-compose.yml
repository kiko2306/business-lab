# Last checked for a newer image: 2026-09-16 - bump this date (even with
# no other change) to force a re-pull on every machine that pulls this
# commit; self-update only recreates an app whose apps/<name>/** changed
# since its last deploy, so this is what moves a `latest`-tagged image
# forward without a version-tag bump to diff against (§449).
services:
  onlyoffice:
    # Sized from anon memory, not `docker stats`: page cache fills whatever
    # the cap is and is reclaimed cheaply, so "95% used" at 640m was mostly
    # cache. Anon peaks ~410 MiB at boot (+ ~70 MiB kernel), which left ~160
    # MiB for an open document under 640m; 1g leaves ~540 MiB. Upstream's
    # minimum is 2 GB for the whole server (§514).
    mem_limit: 1g
    mem_reservation: 256m
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    ports:
      - "${ONLYOFFICE_PORT:-10460}:80"
    environment:
      # Every request between the editor and whatever embeds it (Nextcloud) is
      # signed with this. JWT_ENABLED=false would let anyone who can reach the
      # port open any document the server can fetch, so it stays on and the
      # secret is generated by the dashboard rather than chosen.
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: ${ONLYOFFICE_JWT_HEADER:-Authorization}
      # Terminate TLS at the proxy, not here — the container speaks plain HTTP
      # on :80 and Cloudflare/NPM handle certificates, like every other app.
      USE_UNAUTHORIZED_STORAGE: "false"
      TZ: ${TZ:-UTC}
    labels:
      - "homepage.group=Productivity"
      - "homepage.name=OnlyOffice"
      - "homepage.icon=onlyoffice.png"
      - "homepage.href=http://localhost:${ONLYOFFICE_PORT:-10460}"
      - "homepage.description=Document editor for Nextcloud"
    volumes:
      # The image bundles its own Postgres and RabbitMQ, so these hold real
      # state — losing them loses the document cache and the local database.
      - ./data/data:/var/www/onlyoffice/Data
      - ./data/log:/var/log/onlyoffice
      - ./data/db:/var/lib/postgresql
    healthcheck:
      # /healthcheck returns the literal string "true" when the document
      # server is ready. start_period is long because the bundled Postgres is
      # initialised on first boot.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck | grep -q true || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
