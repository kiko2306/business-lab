services:
  # Generates the database schema before Postgres ever starts.
  #
  # Postgres only runs docker-entrypoint-initdb.d on an *empty* data directory,
  # so the SQL has to exist before its first boot — hence a separate init
  # service the database waits on, rather than an afterwards step. It writes
  # once and then no-ops, so a restart does not churn the file.
  guacamole-initdb:
    mem_limit: 96m
    image: guacamole/guacamole:1.6.0
    user: "0:0"
    command:
      - sh
      - -c
      - test -f /initdb/001-schema.sql || /opt/guacamole/bin/initdb.sh --postgresql > /initdb/001-schema.sql
    restart: "no"
    volumes:
      - ./data/initdb:/initdb
    networks:
      - guacamole-net

  # The proxy daemon that actually speaks RDP, VNC and SSH. No published port:
  # only the web app talks to it, over the compose network.
  guacd:
    mem_limit: 192m
    mem_reservation: 48m
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    volumes:
      - ./data/drive:/drive
      - ./data/record:/record
    networks:
      - guacamole-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4822 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Pinned rather than :latest (§200 slice 1): guacamole-auth-header (a later
  # slice) is a separate jar version-locked to this webapp build — a
  # mismatched pair refuses to load, and :latest can drift out from under it
  # silently on a routine restart.
  guacamole:
    mem_limit: 512m
    mem_reservation: 192m
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    depends_on:
      guacamole-db:
        condition: service_healthy
      guacd:
        condition: service_started
    ports:
      - "${GUACAMOLE_PORT:-10430}:8080"
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: guacamole-db
      POSTGRESQL_DATABASE: ${GUACAMOLE_DB_NAME:-guacamole}
      POSTGRESQL_USER: ${GUACAMOLE_DB_USER:-guacamole}
      POSTGRESQL_PASSWORD: ${GUACAMOLE_DB_PASSWORD}
      # Serve at / rather than /guacamole. Without this every exposed URL
      # carries a /guacamole prefix, and the dashboard's "open" link — which
      # points at the bare hostname — lands on a 404.
      WEBAPP_CONTEXT: ROOT
      # Guacamole is `overlayOnly` (services.ts): reached directly on this
      # published port over NetBird/Tailscale, gated by its own login
      # (guacadmin's default password is auto-rotated to a generated one —
      # guacamoleAdminRotate.ts, §200 slice 1). Same pattern as the other two
      # overlayOnly apps, NPM's admin UI and Pi-hole. There is no reverse
      # proxy in front of it (plan.md §288, §318).
      #
      # Because of that, the bundled `guacamole-auth-header` extension is left
      # OFF: it activates the moment any HTTP_AUTH_* var is set, and with the
      # port reachable directly, an unstripped `Remote-User: guacadmin` header
      # on a request would then be a straight auth bypass — there is no proxy
      # to guarantee the header is set only by Authelia. So no HTTP_AUTH_HEADER
      # here. The jar stays in the image, dormant; if a trusted proxy is ever
      # put in front (the §288 option-2 overlay NPM+Authelia tier), set it then.
      #
      # REMOTE_IP_VALVE_ENABLED only matters behind a proxy (audit-log client
      # IP from X-Forwarded-For); harmless without one — Tomcat's RemoteIpValve
      # only honours XFF from its internal-proxy ranges.
      REMOTE_IP_VALVE_ENABLED: "true"
      TZ: ${TZ:-UTC}
    labels:
      - "homepage.group=Infrastructure"
      - "homepage.name=Guacamole"
      - "homepage.icon=guacamole.png"
      - "homepage.href=http://localhost:${GUACAMOLE_PORT:-10430}"
      - "homepage.description=Browser RDP, VNC and SSH"
    networks:
      - guacamole-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Guacamole's own JDBC auth extension doesn't gate a Postgres version, but
  # 16 is kept in lockstep with nextcloud-db/nocodb-db elsewhere in this
  # stack, which do have a real ceiling (§210.1) — no reason to run a third
  # major for this one alone.
  guacamole-db:
    mem_limit: 256m
    mem_reservation: 96m
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      guacamole-initdb:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${GUACAMOLE_DB_NAME:-guacamole}
      POSTGRES_USER: ${GUACAMOLE_DB_USER:-guacamole}
      POSTGRES_PASSWORD: ${GUACAMOLE_DB_PASSWORD}
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./data/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - guacamole-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GUACAMOLE_DB_USER:-guacamole}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  guacamole-net:
    driver: bridge
