services:
  kitchen-switcher:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${KITCHEN_SWITCHER_PORT:-10220}:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "homepage.group=Productivity"
      - "homepage.name=Kitchen"
      - "homepage.icon=mdi-silverware-fork-knife.png"
      - "homepage.href=http://localhost:${KITCHEN_SWITCHER_PORT:-10220}"
      - "homepage.description=One-click switcher between Mealie and Grocy"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
