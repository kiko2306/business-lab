server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  location = /sw.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
