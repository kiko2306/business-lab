<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kitchen</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#1c1f26" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kitchen" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root { color-scheme: dark light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; background: #14161a; }
  #bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: #1c1f26; border-bottom: 1px solid #2a2e37;
  }
  .tab {
    flex: 1; padding: 10px 14px; border: none; border-radius: 8px;
    background: #262b34; color: #c7ccd6; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background .15s, color .15s;
  }
  .tab.active { background: #3d7bfd; color: #fff; }
  #gear {
    padding: 10px 12px; border: none; border-radius: 8px; background: #262b34;
    color: #c7ccd6; cursor: pointer; font-size: 15px; line-height: 1;
  }
  #frame-wrap { position: relative; height: calc(100% - 54px); }
  iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: none;
    display: none; background: #fff;
  }
  iframe.active { display: block; }
  #cfg {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 10;
  }
  #cfg.open { display: flex; }
  #cfg-box {
    background: #1c1f26; border-radius: 12px; padding: 20px; width: min(420px, 90vw);
    color: #e5e7eb;
  }
  #cfg-box h2 { margin: 0 0 12px; font-size: 16px; }
  #cfg-note { font-size: 12px; line-height: 1.5; color: #9aa1ad; margin: 0; }
  #cfg-box label { display: block; font-size: 13px; margin: 12px 0 4px; color: #9aa1ad; }
  #cfg-box input {
    width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #333944;
    background: #14161a; color: #e5e7eb; font-size: 14px;
  }
  #cfg-box .row { display: flex; gap: 8px; margin-top: 18px; }
  #cfg-box button {
    flex: 1; padding: 9px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  #cfg-save { background: #3d7bfd; color: #fff; }
  #cfg-cancel { background: #2a2e37; color: #c7ccd6; }
</style>
</head>
<body>
  <div id="bar">
    <button id="gear" title="Configure URLs">⚙</button>
  </div>
  <div id="frame-wrap"></div>

  <div id="cfg">
    <div id="cfg-box">
      <h2>Configure app URLs</h2>
      <p id="cfg-note">Filled in from the dashboard — each app's public URL when it is
        exposed, its LAN port when it is not. Override one only if you need to.</p>
      <div id="cfg-fields"></div>
      <div class="row">
        <button id="cfg-cancel">Cancel</button>
        <button id="cfg-save">Save &amp; Reload</button>
      </div>
    </div>
  </div>

  <script>
    // Which apps to show, and where they live, comes from html/config.json —
    // written by the dashboard on every start of this app (backend
    // services/kitchenConfig.ts) from the real exposure state and the real
    // allocated ports. Hard-coded LAN ports used to live here and went stale
    // the moment the port scheme changed.
    var ICONS = { mealie: '\uD83C\uDF72', pantry: '\uD83E\uDDCA' };
    var FALLBACK = {
      mealie: { label: 'Mealie', publicUrl: null, port: 10230 },
      pantry: { label: 'Pantry', publicUrl: null, port: 10300 }
    };

    var apps = [];

    // A per-browser override always wins; otherwise prefer the public URL when
    // this page was itself loaded over one (a LAN port is unreachable from
    // mobile data), and the LAN port on whatever host served this page.
    function resolveUrl(name, cfg) {
      var stored = localStorage.getItem('kitchenSwitcher.' + name + 'Url');
      if (stored) return stored;
      var onPublicHostname = location.hostname.indexOf('.') !== -1 && location.port === '';
      if (onPublicHostname && cfg.publicUrl) return cfg.publicUrl;
      if (cfg.port) return location.protocol + '//' + location.hostname + ':' + cfg.port;
      return cfg.publicUrl || '';
    }

    function setUrl(name, value) {
      if (value) localStorage.setItem('kitchenSwitcher.' + name + 'Url', value);
      else localStorage.removeItem('kitchenSwitcher.' + name + 'Url');
    }

    function render() {
      var bar = document.getElementById('bar');
      var wrap = document.getElementById('frame-wrap');
      var gear = document.getElementById('gear');

      apps.forEach(function (app, index) {
        var btn = document.createElement('button');
        btn.className = 'tab' + (index === 0 ? ' active' : '');
        btn.dataset.app = app.name;
        btn.textContent = (ICONS[app.name] ? ICONS[app.name] + ' ' : '') + app.label;
        bar.insertBefore(btn, gear);

        var frame = document.createElement('iframe');
        frame.id = 'frame-' + app.name;
        if (index === 0) frame.className = 'active';
        frame.src = resolveUrl(app.name, app);
        wrap.appendChild(frame);

        btn.addEventListener('click', function () {
          document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('active', b === btn); });
          document.querySelectorAll('iframe').forEach(function (f) {
            f.classList.toggle('active', f.id === 'frame-' + app.name);
          });
        });
      });
    }

    function openSettings() {
      var fields = document.getElementById('cfg-fields');
      fields.innerHTML = '';
      apps.forEach(function (app) {
        var label = document.createElement('label');
        label.setAttribute('for', 'cfg-' + app.name);
        label.textContent = app.label + ' URL';
        var input = document.createElement('input');
        input.id = 'cfg-' + app.name;
        input.type = 'text';
        input.value = resolveUrl(app.name, app);
        fields.appendChild(label);
        fields.appendChild(input);
      });
      document.getElementById('cfg').classList.add('open');
    }

    document.getElementById('gear').addEventListener('click', openSettings);
    document.getElementById('cfg-cancel').addEventListener('click', function () {
      document.getElementById('cfg').classList.remove('open');
    });
    document.getElementById('cfg-save').addEventListener('click', function () {
      apps.forEach(function (app) {
        var input = document.getElementById('cfg-' + app.name);
        // Saving the value the dashboard already resolved would pin it in this
        // browser forever, so only a real edit is stored.
        setUrl(app.name, input.value.trim() === resolveUrl(app.name, app) ? '' : input.value.trim());
      });
      location.reload();
    });

    function start(config) {
      apps = Object.keys(config).map(function (name) {
        return {
          name: name,
          label: config[name].label || name,
          publicUrl: config[name].publicUrl || null,
          port: config[name].port || null
        };
      });
      render();
    }

    // Cache-busted: the file is rewritten on every start of this app, and a
    // stale cached copy would point the tabs at yesterday's URLs.
    fetch('config.json?t=' + Date.now())
      .then(function (r) { return r.ok ? r.json() : FALLBACK; })
      .catch(function () { return FALLBACK; })
      .then(start);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
