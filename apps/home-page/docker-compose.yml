
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    ports:
      - "${HOMEPAGE_PORT:-10190}:3000"
    environment:
      # Matched against the Host header — comma-separated bare host[:port]
      # values, no scheme, no spaces. The default is the published host port,
      # not the container's 3000: a browser on the LAN sends localhost:10190,
      # and anything not listed here gets "Host validation failed" instead of
      # the page.
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-localhost:${HOMEPAGE_PORT:-10190}}
    volumes:
      - ./data:/app/config
      # Custom app logos (Pantry, Price Compare — no upstream icon) referenced
      # as `/icons/<name>.svg` in services.yaml. Homepage serves `/icons/*`
      # from `public/icons/`, and Next.js snapshots `public/` at boot, so the
      # files must be present when the container starts — a plain bind mount,
      # not a copy-on-start. §131.1.
      - ./data/icons:/app/public/icons:ro
      # Read-only Docker access for label-based service discovery: every
      # other app in apps/*/docker-compose.yml carries homepage.* labels, and
      # Homepage only lists a labeled container while it's actually running
      # (docker.yaml below wires the socket up as a provider).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Homepage lists itself for the same reason every other app carries these:
    # the rule is that a running app is on the start page, with no exceptions
    # to remember when the next app is added.
    labels:
      - "homepage.group=Infrastructure"
      - "homepage.name=Home Page"
      - "homepage.icon=homepage.png"
      - "homepage.href=http://localhost:${HOMEPAGE_PORT:-10190}"
      - "homepage.description=This start page"
    healthcheck:
      # /api/healthcheck, not /health: gethomepage serves the former and 404s
      # the latter, so the container reported unhealthy from boot for its whole
      # life while serving fine (plan.md §91). A healthcheck that is always red
      # is worse than none — it trains the eye to ignore the colour.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
