
services:
  # Vikunja's image runs as uid/gid 1000 but the bind-mounted data dirs are
  # created root-owned by Docker (and older Vikunja images ran as root), so a
  # fresh install — or an image that switched users — can't write its files.
  # One-off chown before the app starts; exits 0. (Vikunja's own image is
  # `FROM scratch` with no shell, hence busybox.)
  vikunja-init:
    image: busybox:stable
    user: "0:0"
    command: ["chown", "-R", "1000:1000", "/db", "/files"]
    restart: "no"
    volumes:
      - ./data/db:/db
      - ./data/files:/files

  vikunja:
    image: vikunja/vikunja:latest
    restart: unless-stopped
    depends_on:
      vikunja-init:
        condition: service_completed_successfully
    ports:
      - "${VIKUNJA_PORT:-10390}:3456"
    environment:
      VIKUNJA_SERVICE_PUBLICURL: ${VIKUNJA_PUBLIC_URL:-http://localhost:3456}
      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_JWT_SECRET}
      # SMTP. Injected from the dashboard's global mail settings (Settings →
      # Email) when set — the backend derives VIKUNJA_MAILER_* via
      # services/mailEnv.ts and flips MAILER_ENABLED to true. Vikunja tries
      # STARTTLS by default; FORCESSL switches to implicit TLS (465). Disabled
      # = no reset emails, as before.
      VIKUNJA_MAILER_ENABLED: ${VIKUNJA_MAILER_ENABLED:-false}
      VIKUNJA_MAILER_HOST: ${VIKUNJA_MAILER_HOST:-}
      VIKUNJA_MAILER_PORT: ${VIKUNJA_MAILER_PORT:-587}
      VIKUNJA_MAILER_USERNAME: ${VIKUNJA_MAILER_USERNAME:-}
      VIKUNJA_MAILER_PASSWORD: ${VIKUNJA_MAILER_PASSWORD:-}
      VIKUNJA_MAILER_FROMEMAIL: ${VIKUNJA_MAILER_FROMEMAIL:-}
      VIKUNJA_MAILER_FORCESSL: ${VIKUNJA_MAILER_FORCESSL:-false}
    labels:
      - "homepage.group=Productivity"
      - "homepage.name=Vikunja"
      - "homepage.icon=vikunja.png"
      - "homepage.href=http://localhost:${VIKUNJA_PORT:-10390}"
      - "homepage.description=Task and project management"
    volumes:
      - ./data/db:/db
      - ./data/files:/app/vikunja/files
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3456/api/v1/info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
