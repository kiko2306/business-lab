# Last checked for a newer image: 2026-09-16 - bump this date (even with
# no other change) to force a re-pull on every machine that pulls this
# commit; self-update only recreates an app whose apps/<name>/** changed
# since its last deploy, so this is what moves a `latest`-tagged image
# forward without a version-tag bump to diff against (§449).
services:
  twenty-server:
    # Pinned, not floated: Twenty runs DB migrations on boot with no
    # downgrade path, so a surprise major jump on `latest` can strand the
    # database. The self-update panel (§209) bumps this deliberately.
    image: twentycrm/twenty:${TWENTY_TAG:-v2.39.5}
    mem_limit: 1200m
    mem_reservation: 512m
    restart: unless-stopped
    ports:
      - "${TWENTY_PORT:-10580}:3000"
    environment:
      SERVER_URL: ${SERVER_URL:-http://localhost:10580}
      PG_DATABASE_URL: postgres://${TWENTY_DB_USER:-twenty}:${TWENTY_DB_PASSWORD}@twenty-db:5432/${TWENTY_DB_NAME:-twenty}
      REDIS_URL: redis://twenty-redis:6379
      # `openssl rand`-grade random, generated by the dashboard on first start.
      # APP_SECRET is the legacy name still read by v2; ENCRYPTION_KEY is the
      # current one for field-level encryption. FALLBACK_ENCRYPTION_KEY is only
      # for key rotation — left unset.
      APP_SECRET: ${TWENTY_APP_SECRET}
      ENCRYPTION_KEY: ${TWENTY_APP_SECRET}
      STORAGE_TYPE: local
      # Twenty ignores this env var — it renders in the config panel only, so
      # the generated value backend/src/services/twentyAdminBootstrap.ts (§421)
      # signs up with is visible/backup-able, same convention as DocuSeal's.
      TWENTY_ADMIN_PASSWORD: ${TWENTY_ADMIN_PASSWORD:-}
      NODE_PORT: 3000
    labels:
      - "homepage.group=Productivity"
      - "homepage.name=Twenty"
      - "homepage.icon=twenty.png"
      - "homepage.href=http://localhost:${TWENTY_PORT:-10580}"
      - "homepage.description=Open-source CRM"
    volumes:
      - ./data/storage:/app/packages/twenty-server/.local-storage
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    networks:
      - twenty-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 10
      # First boot runs every migration before the server listens.
      start_period: 180s

  twenty-worker:
    # Same image, background queue processor (emails, record imports, cron).
    # No published port; shares the server's local-storage tree.
    image: twentycrm/twenty:${TWENTY_TAG:-v2.39.5}
    mem_limit: 900m
    mem_reservation: 384m
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    environment:
      SERVER_URL: ${SERVER_URL:-http://localhost:10580}
      PG_DATABASE_URL: postgres://${TWENTY_DB_USER:-twenty}:${TWENTY_DB_PASSWORD}@twenty-db:5432/${TWENTY_DB_NAME:-twenty}
      REDIS_URL: redis://twenty-redis:6379
      APP_SECRET: ${TWENTY_APP_SECRET}
      ENCRYPTION_KEY: ${TWENTY_APP_SECRET}
      STORAGE_TYPE: local
    volumes:
      - ./data/storage:/app/packages/twenty-server/.local-storage
    depends_on:
      twenty-server:
        condition: service_started
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    networks:
      - twenty-net

  twenty-db:
    # Drop-in for postgres:16-alpine that runs pg_upgrade in place on a major
    # bump, so a future tag change doesn't strand the cluster (same choice as
    # n8n-db / paperless-db, §181/§182). backup.engine=postgres is the fallback.
    image: pgautoupgrade/pgautoupgrade:16-alpine
    mem_limit: 300m
    mem_reservation: 96m
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TWENTY_DB_NAME:-twenty}
      POSTGRES_USER: ${TWENTY_DB_USER:-twenty}
      POSTGRES_PASSWORD: ${TWENTY_DB_PASSWORD}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - twenty-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TWENTY_DB_USER:-twenty}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  twenty-redis:
    # Valkey, not Redis: redis:7+ is RSALv2/SSPL (docs/licences.md). Valkey is
    # the BSD-3 fork, wire-compatible; Immich and Paperless already run it.
    # noeviction so BullMQ jobs are never dropped under memory pressure.
    image: docker.io/valkey/valkey:9-alpine
    mem_limit: 128m
    mem_reservation: 32m
    restart: unless-stopped
    command: ["--maxmemory-policy", "noeviction"]
    volumes:
      - ./data/valkey:/data
    networks:
      - twenty-net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  twenty-net:
    driver: bridge
