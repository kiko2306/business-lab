
# Last checked for a newer image: 2026-09-16 - bump this date (even with
# no other change) to force a re-pull on every machine that pulls this
# commit; self-update only recreates an app whose apps/<name>/** changed
# since its last deploy, so this is what moves a `latest`-tagged image
# forward without a version-tag bump to diff against (§449).
services:
  pihole:
    mem_limit: 192m
    mem_reservation: 64m
    image: pihole/pihole:latest
    restart: unless-stopped
    ports:
      - "${PIHOLE_DNS_PORT:-53}:53/tcp"
      - "${PIHOLE_DNS_PORT:-53}:53/udp"
      - "${PIHOLE_WEB_PORT:-10320}:80/tcp"
    environment:
      TZ: ${TZ:-UTC}
      WEBPASSWORD: ${PIHOLE_WEB_PASSWORD}
      # Pi-hole v6 defaults to LOCAL: answer only clients on its own subnets.
      # On a bridge network a LAN client's query arrives with its real
      # 192.168.x source, which is not the container's subnet, so every LAN
      # query was dropped (UDP timeout, TCP reset) and only the host's own
      # loopback queries (arriving from the Docker gateway) got answers.
      # Found 2026-09-18 when a LAN browser couldn't resolve the dashboard
      # (§528). ALL is Pi-hole's documented setting for Docker bridge mode.
      # Port 53 is reachable only from the LAN and the VPN overlays, never
      # the internet (no port forwarding, principle 1), so this doesn't make
      # it an open resolver.
      FTLCONF_dns_listeningMode: "ALL"
    labels:
      - "homepage.group=Infrastructure"
      - "homepage.name=Pi-hole"
      - "homepage.icon=pi-hole.png"
      - "homepage.href=http://localhost:${PIHOLE_WEB_PORT:-10320}"
      - "homepage.description=DNS ad blocker"
    volumes:
      - ./data/pihole:/etc/pihole
      - ./data/dnsmasq:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
