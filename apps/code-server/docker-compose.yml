
services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    restart: unless-stopped
    ports:
      - "${CODE_SERVER_PORT:-8443}:8443"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      # No PASSWORD/HASHED_PASSWORD set — code-server's own web login is
      # disabled entirely; Authelia forward-auth (dashboard's Exposure
      # settings → "Require Authelia login") is the only gate in front of
      # it. Direct LAN access to this container's own port has no auth at
      # all — restrict that at the network level if this box isn't trusted.
      SUDO_PASSWORD: ${CODE_SERVER_SUDO_PASSWORD}
    labels:
      - "homepage.group=Development"
      - "homepage.name=Code Server"
      - "homepage.icon=code-server.png"
      - "homepage.href=http://localhost:${CODE_SERVER_PORT:-8443}"
      - "homepage.description=VS Code in the browser"
    volumes:
      - ./data:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
