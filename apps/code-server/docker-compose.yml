
services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    restart: unless-stopped
    ports:
      - "${CODE_SERVER_PORT:-10130}:8443"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      # code-server's own web login, gating direct LAN access to :10130.
      # Authelia forward-auth (dashboard's Exposure settings → "Require
      # Authelia login") additionally gates the tunnel-exposed hostname, but
      # NPM reaches this container via the docker bridge gateway IP and
      # published port — the same path a LAN client uses — so Authelia alone
      # never sees LAN-direct traffic and cannot be the only gate (plan.md
      # §93). PASSWORD is a hidden, auto-generated secret (services.ts); read
      # it from apps/code-server/.env if you need to log in from the LAN.
      PASSWORD: ${CODE_SERVER_PASSWORD}
      SUDO_PASSWORD: ${CODE_SERVER_SUDO_PASSWORD}
      # Open the mounted home directory on first load, so "~/" is there
      # without a File -> Open Folder step.
      DEFAULT_WORKSPACE: ${CODE_SERVER_HOME:-/home/mat}
    labels:
      - "homepage.group=Development"
      - "homepage.name=Code Server"
      - "homepage.icon=code-server.png"
      - "homepage.href=http://localhost:${CODE_SERVER_PORT:-10130}"
      - "homepage.description=VS Code in the browser"
    volumes:
      - ./data:/config
      # The host home directory, mounted at the SAME absolute path inside the
      # container as outside it. Same reasoning as APPS_DIR in the root compose
      # file: a path copied from a host terminal, a git worktree path, or an
      # absolute path in a VS Code task then resolves identically in both
      # places, instead of silently pointing somewhere else.
      #
      # PUID/PGID above are 1000, which is the owner of this directory, so
      # files created from the IDE keep the right ownership.
      #
      # NOTE ON BLAST RADIUS: this hands the browser IDE everything in the home
      # directory — ~/.ssh, ~/.gnupg, ~/.docker, and every apps/*/.env in the
      # checkout. code-server's own login (PASSWORD, above) now gates both the
      # LAN port and the tunnel hostname. Narrow CODE_SERVER_HOME to a
      # subdirectory (e.g. /home/mat/www) if that trade still isn't wanted.
      - ${CODE_SERVER_HOME:-/home/mat}:${CODE_SERVER_HOME:-/home/mat}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
