version: "3.9"

services:
  speedtest:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    restart: unless-stopped
    ports:
      - "${SPEEDTEST_PORT:-80}:80"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      APP_KEY: ${SPEEDTEST_APP_KEY}
    volumes:
      - speedtest-data:/config

volumes:
  speedtest-data:
    driver: local
