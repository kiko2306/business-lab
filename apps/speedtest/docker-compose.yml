
services:
  speedtest:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    restart: unless-stopped
    ports:
      - "${SPEEDTEST_PORT:-10350}:80"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      APP_KEY: ${SPEEDTEST_APP_KEY}
      # APP_URL must match the browser URL or assets 404 and login hits a 419
      # CSRF error; the dashboard sets it when exposure is enabled.
      APP_URL: ${SPEEDTEST_APP_URL:-http://localhost:80}
      APP_TRUSTED_PROXIES: ${SPEEDTEST_TRUSTED_PROXIES:-*}
    labels:
      - "homepage.group=Monitoring & Backup"
      - "homepage.name=Speedtest"
      - "homepage.icon=speedtest-tracker.png"
      - "homepage.href=http://localhost:${SPEEDTEST_PORT:-10350}"
      - "homepage.description=Internet speed testing tool"
    volumes:
      - ./data:/config
