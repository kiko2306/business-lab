
services:
  speedtest:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    restart: unless-stopped
    ports:
      - "${SPEEDTEST_PORT:-80}:80"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      APP_KEY: ${SPEEDTEST_APP_KEY}
    labels:
      - "homepage.group=Monitoring & Backup"
      - "homepage.name=Speedtest"
      - "homepage.icon=speedtest-tracker.png"
      - "homepage.href=http://localhost:${SPEEDTEST_PORT:-80}"
      - "homepage.description=Internet speed testing tool"
    volumes:
      - ./data:/config
