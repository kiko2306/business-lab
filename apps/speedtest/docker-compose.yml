
# Last checked for a newer image: 2026-09-16 - bump this date (even with
# no other change) to force a re-pull on every machine that pulls this
# commit; self-update only recreates an app whose apps/<name>/** changed
# since its last deploy, so this is what moves a `latest`-tagged image
# forward without a version-tag bump to diff against (§449).
services:
  speedtest:
    mem_limit: 192m
    mem_reservation: 48m
    image: lscr.io/linuxserver/speedtest-tracker:latest
    restart: unless-stopped
    ports:
      - "${SPEEDTEST_PORT:-10350}:80"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      APP_KEY: ${SPEEDTEST_APP_KEY}
      # APP_URL must match the browser URL or assets 404 and login hits a 419
      # CSRF error; the dashboard sets it when exposure is enabled.
      APP_URL: ${SPEEDTEST_APP_URL:-http://localhost:80}
      APP_TRUSTED_PROXIES: ${SPEEDTEST_TRUSTED_PROXIES:-*}
    labels:
      - "homepage.group=Monitoring & Backup"
      - "homepage.name=Speedtest"
      - "homepage.icon=speedtest-tracker.png"
      - "homepage.href=http://localhost:${SPEEDTEST_PORT:-10350}"
      - "homepage.description=Internet speed testing tool"
    volumes:
      - ./data:/config
