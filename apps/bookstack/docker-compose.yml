
services:
  bookstack:
    mem_limit: 320m
    mem_reservation: 128m
    image: lscr.io/linuxserver/bookstack:latest
    restart: unless-stopped
    ports:
      - "${BOOKSTACK_PORT:-10120}:80"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      APP_URL: ${BOOKSTACK_URL:-http://localhost:80}
      # LSIO's BookStack image halts on boot without a valid Laravel key
      # ("The application key is missing"); the dashboard generates one.
      APP_KEY: ${BOOKSTACK_APP_KEY}
      # Trust the reverse proxy's X-Forwarded-* so BookStack builds https URLs
      # (and OIDC redirect_uri) correctly. Set to '*' by the exposure system
      # only while exposed — nothing but NPM reaches this port.
      APP_PROXIES: ${BOOKSTACK_APP_PROXIES:-}
      # Authelia OIDC (§344). All blank/`standard` until the exposure system
      # injects them from the registered client (services.ts `oidcClient`);
      # then AUTH_METHOD=oidc + AUTH_AUTO_INITIATE hides the local form and
      # sends every login straight to Authelia, and the Authelia `admins`
      # group maps to BookStack's "Admin" role on first sign-in. Break-glass:
      # /login?prevent_auto_init=true still reaches the standard page.
      AUTH_METHOD: ${BOOKSTACK_AUTH_METHOD:-standard}
      AUTH_AUTO_INITIATE: ${BOOKSTACK_AUTH_AUTO_INITIATE:-false}
      OIDC_NAME: ${BOOKSTACK_OIDC_NAME:-Authelia}
      OIDC_ISSUER: ${BOOKSTACK_OIDC_ISSUER:-}
      OIDC_ISSUER_DISCOVER: ${BOOKSTACK_OIDC_ISSUER_DISCOVER:-true}
      OIDC_CLIENT_ID: ${BOOKSTACK_OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${BOOKSTACK_OIDC_CLIENT_SECRET:-}
      OIDC_USER_TO_GROUPS: ${BOOKSTACK_OIDC_USER_TO_GROUPS:-false}
      OIDC_GROUPS_CLAIM: ${BOOKSTACK_OIDC_GROUPS_CLAIM:-groups}
      OIDC_ADDITIONAL_SCOPES: ${BOOKSTACK_OIDC_ADDITIONAL_SCOPES:-}
      OIDC_REMOVE_FROM_GROUPS: ${BOOKSTACK_OIDC_REMOVE_FROM_GROUPS:-false}
      DB_HOST: bookstack-db
      DB_PORT: 3306
      # Current LSIO image uses DB_USERNAME/DB_PASSWORD (the old DB_USER/DB_PASS
      # are ignored → BookStack falls back to its "database_username" default
      # and the DB denies access).
      DB_USERNAME: ${BOOKSTACK_DB_USER:-bookstack}
      DB_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
      DB_DATABASE: ${BOOKSTACK_DB_NAME:-bookstack}
      # Outgoing mail. Injected from the dashboard's global mail settings
      # (Settings → Email) when they're set — the backend derives BOOKSTACK_MAIL_*
      # via services/mailEnv.ts. Left at these inert defaults BookStack simply
      # has no working mailer, exactly as before this was wired.
      MAIL_DRIVER: ${BOOKSTACK_MAIL_DRIVER:-smtp}
      MAIL_HOST: ${BOOKSTACK_MAIL_HOST:-localhost}
      MAIL_PORT: ${BOOKSTACK_MAIL_PORT:-587}
      MAIL_USERNAME: ${BOOKSTACK_MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${BOOKSTACK_MAIL_PASSWORD:-null}
      MAIL_ENCRYPTION: ${BOOKSTACK_MAIL_ENCRYPTION:-null}
      MAIL_FROM: ${BOOKSTACK_MAIL_FROM:-bookstack@example.com}
      MAIL_FROM_NAME: ${BOOKSTACK_MAIL_FROM_NAME:-BookStack}
    labels:
      - "homepage.group=Productivity"
      - "homepage.name=BookStack"
      - "homepage.icon=bookstack.png"
      - "homepage.href=http://localhost:${BOOKSTACK_PORT:-10120}"
      - "homepage.description=Wiki and knowledge management"
    volumes:
      - ./data/app:/config
    depends_on:
      bookstack-db:
        condition: service_healthy
    networks:
      - bookstack-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  bookstack-db:
    mem_limit: 256m
    mem_reservation: 96m
    image: lscr.io/linuxserver/mariadb:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      MYSQL_ROOT_PASSWORD: ${BOOKSTACK_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${BOOKSTACK_DB_NAME:-bookstack}
      MYSQL_USER: ${BOOKSTACK_DB_USER:-bookstack}
      MYSQL_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
    volumes:
      - ./data/db:/config
    networks:
      - bookstack-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  bookstack-net:
    driver: bridge
