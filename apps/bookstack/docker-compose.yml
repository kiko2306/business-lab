version: "3.9"

services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    restart: unless-stopped
    ports:
      - "${BOOKSTACK_PORT:-80}:80"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      APP_URL: ${BOOKSTACK_URL:-http://localhost:80}
      DB_HOST: bookstack-db
      DB_PORT: 3306
      DB_USER: ${BOOKSTACK_DB_USER:-bookstack}
      DB_PASS: ${BOOKSTACK_DB_PASSWORD}
      DB_DATABASE: ${BOOKSTACK_DB_NAME:-bookstack}
    volumes:
      - bookstack-data:/config
    depends_on:
      bookstack-db:
        condition: service_healthy
    networks:
      - bookstack-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  bookstack-db:
    image: lscr.io/linuxserver/mariadb:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      MYSQL_ROOT_PASSWORD: ${BOOKSTACK_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${BOOKSTACK_DB_NAME:-bookstack}
      MYSQL_USER: ${BOOKSTACK_DB_USER:-bookstack}
      MYSQL_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
    volumes:
      - bookstack-db-data:/config
    networks:
      - bookstack-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bookstack-data:
    driver: local
  bookstack-db-data:
    driver: local

networks:
  bookstack-net:
    driver: bridge
