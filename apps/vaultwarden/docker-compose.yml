
services:
  vaultwarden:
    image: vaultwarden/server:latest
    restart: unless-stopped
    ports:
      - "${VAULTWARDEN_PORT:-10380}:80"
    environment:
      # Email. These are filled from the dashboard's global mail settings
      # (Settings -> Email) via mailEnvKeys on vaultwarden in
      # backend/src/config/services.ts — not set by hand. Left unset, Vaultwarden
      # simply runs without email, which disables invitations and 2FA-by-email.
      #
      # SMTP_SECURITY defaults to "off", not "": compose's ${VAR:-} still
      # defines the env var, just as an empty string, and Vaultwarden treats
      # that as an explicitly-invalid enum value (must be starttls/force_tls/
      # off) rather than "not configured" — it crash-loops on every fresh
      # deploy where mail was never set up, since SMTP_HOST being empty
      # doesn't stop this check from running.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-off}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      DOMAIN: ${VAULTWARDEN_DOMAIN:-http://localhost:8222}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-true}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
    labels:
      - "homepage.group=Security"
      - "homepage.name=Vaultwarden"
      - "homepage.icon=vaultwarden.png"
      - "homepage.href=http://localhost:${VAULTWARDEN_PORT:-10380}"
      - "homepage.description=Self-hosted password manager"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/alive || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
