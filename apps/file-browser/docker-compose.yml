
services:
  # filebrowser's image runs as uid/gid 1000 but Docker creates the
  # bind-mounted dirs root-owned, so a fresh install can't write its DB.
  # One-off chown before the app starts; exits 0.
  filebrowser-init:
    image: busybox:stable
    user: "0:0"
    command: ["chown", "-R", "1000:1000", "/database", "/srv"]
    restart: "no"
    volumes:
      - ./data/database:/database
      - ./data/files:/srv

  filebrowser:
    image: filebrowser/filebrowser:latest
    restart: unless-stopped
    depends_on:
      filebrowser-init:
        condition: service_completed_successfully
    ports:
      - "${FILEBROWSER_PORT:-8080}:80"
    labels:
      - "homepage.group=Media & Files"
      - "homepage.name=File Browser"
      - "homepage.icon=filebrowser.png"
      - "homepage.href=http://localhost:${FILEBROWSER_PORT:-8080}"
      - "homepage.description=Web-based file manager"
    volumes:
      - ./data/database:/database
      - ./data/files:/srv
