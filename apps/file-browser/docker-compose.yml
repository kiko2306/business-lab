
services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    restart: unless-stopped
    ports:
      - "${FILEBROWSER_PORT:-8080}:80"
    volumes:
      - filebrowser-data:/database
      - filebrowser-srv:/srv

volumes:
  filebrowser-data:
    driver: local
  filebrowser-srv:
    driver: local
