
services:
  # filebrowser's image runs as uid/gid 1000 but Docker creates the
  # bind-mounted dirs root-owned, so a fresh install can't write its DB.
  # One-off chown before the app starts; exits 0. /srv also gets a world
  # write/traverse bit: Nextcloud's External Storage app (§219) mounts this
  # same tree as www-data (uid 33 in its own container), a uid this chown
  # can't predict or match, so group ownership alone isn't enough.
  filebrowser-init:
    image: busybox:stable
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /database /srv && chmod -R o+rwX /srv"]
    restart: "no"
    volumes:
      - ./data/database:/database
      - ./data/files:/srv

  filebrowser:
    image: filebrowser/filebrowser:latest
    restart: unless-stopped
    depends_on:
      filebrowser-init:
        condition: service_completed_successfully
    ports:
      - "${FILEBROWSER_PORT:-10160}:80"
    labels:
      - "homepage.group=Media & Files"
      - "homepage.name=File Browser"
      - "homepage.icon=filebrowser.png"
      - "homepage.href=http://localhost:${FILEBROWSER_PORT:-10160}"
      - "homepage.description=Web-based file manager"
    volumes:
      - ./data/database:/database
      - ./data/files:/srv
      # The home directory, mounted under the server root at the same path it
      # has on the host, so what the UI shows as /home/mat is /home/mat.
      #
      # NOTE ON BLAST RADIUS: this is read-write and reaches ~/.ssh, ~/.gnupg,
      # ~/.docker and every apps/*/.env in the checkout — the same trade
      # code-server made (§78.1), with one difference in our favour: File
      # Browser has its own login, so the LAN port is not ungated. Narrow
      # FILEBROWSER_HOME to a subdirectory (e.g. /home/mat/www) if that trade
      # isn't wanted.
      #
      # Deliberately NOT added to filebrowser-init above: that container runs
      # `chown -R 1000:1000 /srv`, which would rewrite ownership of the entire
      # home directory.
      - ${FILEBROWSER_HOME:-/home/mat}:/srv${FILEBROWSER_HOME:-/home/mat}
