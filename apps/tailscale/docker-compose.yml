
services:
  tailscale:
    mem_limit: 128m
    mem_reservation: 32m
    image: tailscale/tailscale:latest
    restart: unless-stopped
    environment:
      # :-change-me default: an unauthenticated container just crash-loops
      # (restart: unless-stopped) rather than blocking the rest of this
      # compose file — same reasoning as netbird-client's NB_SETUP_KEY
      # (apps/netbird-vpn/docker-compose.yml, §405.1).
      TS_AUTHKEY: ${TAILSCALE_AUTH_KEY:-change-me}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      # Pin the node name. Unset, tailscaled reports the container's hostname
      # — which is the container ID — so every recreate registers the node
      # under a new name and its MagicDNS `<name>.<tailnet>.ts.net` changes.
      # NetBird's signal server is published at exactly that hostname
      # (management.json `Signal.URI`), so an unpinned name means every
      # tailscale restart silently points signal at a dead address and the
      # whole overlay drops until start.sh re-patches it (plan.md §362/§363).
      # One deployment is one tailnet (§84.7); override in .env only if two
      # share one, to avoid Tailscale's `-2` de-dupe suffix.
      TS_HOSTNAME: ${TS_HOSTNAME:-businesslab-signal}
      # An OAuth-client-issued auth key always carries a tag, and Tailscale
      # refuses to authenticate unless the node explicitly advertises it —
      # containerboot's `tailscale up` otherwise dies with "oauth authkeys
      # require --advertise-tags" (found live, §367, crash-loop on a fresh
      # OAuth key). Safe for a personal reusable key too: the ACL's
      # `tagOwners` grants `tag:businesslab` to `autogroup:owner`, so the
      # tailnet owner's own key can advertise it as well.
      TS_EXTRA_ARGS: --advertise-tags=tag:businesslab
      # Neither read by this container — referenced here only so the
      # dashboard's generic per-app config panel surfaces them (it lists
      # whatever a compose file substitutes; see extractComposeEnvVars in
      # backend/src/config/services.ts). tailscaleAutomation.ts (backend)
      # reads them straight from .env to drive Tailscale's own API and
      # keep TAILSCALE_AUTH_KEY minted/fresh — plan.md §408.
      TAILSCALE_OAUTH_CLIENT_ID: "${TAILSCALE_OAUTH_CLIENT_ID:-change-me}"
      TAILSCALE_OAUTH_CLIENT_SECRET: "${TAILSCALE_OAUTH_CLIENT_SECRET:-change-me}"
    labels:
      - "homepage.group=Infrastructure"
      - "homepage.name=Tailscale"
      - "homepage.icon=tailscale.png"
      - "homepage.href=#"
      - "homepage.description=Mesh VPN service (no web UI)"
    volumes:
      - ./data:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
