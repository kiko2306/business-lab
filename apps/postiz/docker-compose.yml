# Postiz — social-media scheduling, adopted unmodified (AGPL-3.0). plan.md
# §84.3a / §254 P3, root-caused in §257.
#
# Five containers: postiz (frontend + backend + orchestrator + nginx in one,
# via pm2), its Postgres, a Valkey, plus Temporal and Temporal's own Postgres
# — Temporal is a hard dependency of the Postiz backend, there is no lighter
# scheduler path. Elasticsearch is deliberately NOT run (§257): it would be a
# 6th container and ~300 MB more RAM, and dropping it only bites because of the
# search-attribute cap handled below.
#
# The backend never edits this file (it is read-only to the dashboard); the
# dashboard generates apps/postiz/.env and injects the public-URL overrides at
# start time via exposureEnvKeys.

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    restart: unless-stopped
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      # Gated on Temporal being *ready*, not just started: auto-setup's schema
      # + namespace bootstrap takes 60-90s and the Postiz backend hard-fails
      # its Temporal handshake if it races ahead (§257).
      temporal:
        condition: service_healthy
    ports:
      - "${POSTIZ_PORT:-10530}:5000"
    environment:
      # One public-URL knob, set to https://<hostname> by the dashboard while
      # exposure is on (exposureEnvKeys.url), else the localhost default from
      # .env. NEXT_PUBLIC_BACKEND_URL is that same origin + /api — the path the
      # in-container nginx proxies to the backend on :3000.
      MAIN_URL: ${POSTIZ_MAIN_URL:-http://localhost:10530}
      FRONTEND_URL: ${POSTIZ_MAIN_URL:-http://localhost:10530}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_MAIN_URL:-http://localhost:10530}/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      JWT_SECRET: ${POSTIZ_JWT_SECRET}
      DATABASE_URL: postgresql://${POSTIZ_DB_USER:-postiz}:${POSTIZ_DB_PASSWORD}@postiz-postgres:5432/${POSTIZ_DB_NAME:-postiz}
      REDIS_URL: redis://postiz-redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      # Self-host mode: no SaaS billing/onboarding paths.
      IS_GENERAL: "true"
      # Open so the first account can be created; close it from the dashboard
      # (Configuration → POSTIZ_DISABLE_REGISTRATION=true) once you have logged
      # in — one client, one owner.
      DISABLE_REGISTRATION: ${POSTIZ_DISABLE_REGISTRATION:-false}
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      API_LIMIT: 30
      NX_ADD_PLUGINS: "false"
    volumes:
      - ./data/config:/config
      - ./data/uploads:/uploads
    labels:
      - "homepage.group=Productivity"
      - "homepage.name=Postiz"
      - "homepage.icon=postiz.png"
      - "homepage.href=http://localhost:${POSTIZ_PORT:-10530}"
      - "homepage.description=Social media scheduling"
    networks:
      - postiz-net
      - postiz-temporal-net
    healthcheck:
      # The image has neither curl nor wget — only node. /api/ returns 200
      # once the NestJS backend has bound :3000 (the §257 failure was it never
      # doing so).
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:5000/api/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  postiz-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTIZ_DB_NAME:-postiz}
      POSTGRES_USER: ${POSTIZ_DB_USER:-postiz}
      POSTGRES_PASSWORD: ${POSTIZ_DB_PASSWORD}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - postiz-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTIZ_DB_USER:-postiz} -d ${POSTIZ_DB_NAME:-postiz}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postiz-redis:
    # Valkey, not Redis 7.4+ (RSALv2/SSPL) — same wire protocol, BSD-3-Clause,
    # already the estate's Redis (Immich, Paperless). See docs/licences.md.
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    networks:
      - postiz-net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${POSTIZ_TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgres
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development-sql.yaml
      - TEMPORAL_NAMESPACE=default
      # SQL visibility (no Elasticsearch) has exactly 3 Text search-attribute
      # slots. auto-setup's sample attrs eat 2; the Postiz backend needs to
      # register 2 more (organizationId, postId) in onModuleInit and hard-fails
      # ("cannot have more than 3 search attribute of type Text") if it can't —
      # then never binds :3000 and every /api call 502s. Skipping the samples
      # frees all 3 slots. This is the §257 blocker fix.
      - SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES=true
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks:
      - postiz-temporal-net
    healthcheck:
      # auto-setup ships no healthcheck. "namespace default is serving" is the
      # readiness signal the Postiz backend actually needs. The frontend gRPC
      # binds the container IP, not loopback, so target $(hostname -i).
      test: ["CMD-SHELL", "temporal operator namespace describe -n default --address $(hostname -i):7233 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 90s

  temporal-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${POSTIZ_TEMPORAL_DB_PASSWORD}
    volumes:
      - ./data/temporal-db:/var/lib/postgresql/data
    networks:
      - postiz-temporal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  postiz-net:
    driver: bridge
  postiz-temporal-net:
    driver: bridge

# All state is bind-mounted under ./data (gitignored), matching the other app
# stacks — no named volumes. postiz runs as root, so no chown init container
# is needed (unlike n8n).
