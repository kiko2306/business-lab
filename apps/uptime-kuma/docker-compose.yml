
services:
  # v2 is a breaking major, not a routine bump: a one-time DB migration that
  # can take hours on a large history, Alpine-based images dropped, minimum
  # Node 20.4, and changed internal API shapes. Pinned to v1 deliberately;
  # floats within v1 until the v2 move is done on purpose, migration path
  # read first.
  uptime-kuma:
    mem_limit: 256m
    mem_reservation: 96m
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_PORT:-10370}:3001"
    environment:
      # NOT read by Uptime Kuma — a carrier so the dashboard's config panel
      # shows the field and auto-generates a value. The backend uses it to
      # create the admin via Uptime Kuma's Socket.IO `setup` event
      # (services/uptimeKumaAdminBootstrap.ts), which is what clears the
      # first-run wizard the uptime-kuma-init comment below mentions.
      # With `disableAuth` on, this password is never used to log in —
      # Authelia is the gate — so it is a break-glass credential for anyone
      # who turns Uptime Kuma's own auth back on.
      UPTIME_KUMA_ADMIN_PASSWORD: ${UPTIME_KUMA_ADMIN_PASSWORD:-}
    labels:
      - "homepage.group=Monitoring & Backup"
      - "homepage.name=Uptime Kuma"
      - "homepage.icon=uptime-kuma.png"
      - "homepage.href=http://localhost:${UPTIME_KUMA_PORT:-10370}"
      - "homepage.description=Uptime and status monitoring with alerts"
    volumes:
      - ./data:/app/data
    healthcheck:
      # wget isn't in the image any more (upstream base change, unrelated to
      # this file) — curl is. Was silently unhealthy until this.
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # "Disable Auth" (plan.md §227, §216) has no env var upstream — it is a
  # plain row in the `setting` table (key `disableAuth`, JSON-stringified
  # value, type `general`), only ever written by the Security page's save
  # handler. Idempotent upsert after every boot so Authelia stays the only
  # gate once this lands, the same shape as beszel-init's direct sqlite
  # write. Reuses the app's own image — it already ships the sqlite3 CLI,
  # so no extra package fetch like beszel-init needs. Doesn't touch the
  # `user` table: an empty one still forces the first-run setup wizard
  # (`docs/app-credentials.md`), same as before this change.
  uptime-kuma-init:
    mem_limit: 96m
    image: louislam/uptime-kuma:1
    restart: "no"
    depends_on:
      uptime-kuma:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        sqlite3 /app/data/kuma.db ".timeout 15000" "
          INSERT INTO setting (key, value, type) VALUES ('disableAuth', 'true', 'general')
          ON CONFLICT(key) DO UPDATE SET value = 'true', type = 'general';
        "
        echo "uptime-kuma-init: disableAuth set"
