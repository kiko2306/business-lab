services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:latest
    restart: unless-stopped
    ports:
      - "${HOMEBOX_PORT:-10440}:7745"
    environment:
      # Registration open by default would mean whoever reaches the LAN port
      # first can create an account. The first person to open it should claim
      # it and then turn this off — see docs/app-credentials.md.
      HBOX_OPTIONS_ALLOW_REGISTRATION: ${HOMEBOX_ALLOW_REGISTRATION:-true}
      HBOX_WEB_MAX_UPLOAD_SIZE: ${HOMEBOX_MAX_UPLOAD_MB:-10}
      # Required, and the app refuses to boot without at least 32 bytes of it.
      # Generated by the dashboard and hidden: rotating it invalidates every
      # API key already issued, so it must never be casually regenerated.
      HBOX_AUTH_API_KEY_PEPPER: ${HOMEBOX_API_KEY_PEPPER}
      TZ: ${TZ:-UTC}
    labels:
      - "homepage.group=Productivity"
      - "homepage.name=Homebox"
      - "homepage.icon=homebox.png"
      - "homepage.href=http://localhost:${HOMEBOX_PORT:-10440}"
      - "homepage.description=Asset, warranty and inventory tracking"
    volumes:
      # SQLite plus uploaded attachments; the image declares /data as a volume
      # and stores both there.
      - ./data:/data
    healthcheck:
      # 127.0.0.1 rather than localhost: the app binds IPv4 only, and a
      # busybox wget resolving ::1 first would report a healthy app as down —
      # the same trap the Kitchen switcher hit (§81 conversation).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7745/api/v1/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
