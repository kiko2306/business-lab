<main class="auth-page container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-9 col-lg-8 col-xl-7">
      <section class="card border-0 shadow auth-card">
        <div class="card-body p-4 p-lg-5 text-center">
          <h1 class="h3 mb-3">{{ 'unsubscribe.title' | t }}</h1>

          <div *ngIf="loading" class="text-body-secondary py-4">
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
            {{ 'unsubscribe.working' | t }}
          </div>

          <div *ngIf="!loading && !error" class="alert alert-success mb-0">
            {{ 'unsubscribe.done' | t }}
          </div>

          <div *ngIf="!loading && error" class="alert alert-danger mb-0">
            {{ error }}
          </div>

          <p class="text-center text-body-secondary small mt-4 mb-0" *ngIf="!loading">
            <a routerLink="/login">{{ 'unsubscribe.signInLink' | t }}</a>
          </p>
        </div>
      </section>
    </div>
  </div>
</main>
