<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h1 class="h3 mb-1">Recovery mode</h1>
      <p class="text-body-secondary mb-0">Emergency local-only tooling for admin credential recovery.</p>
    </div>
    <a class="btn btn-outline-secondary btn-sm" routerLink="/dashboard">Back to dashboard</a>
  </div>

  <div class="card mb-3">
    <div class="card-body d-flex justify-content-between align-items-center">
      <div>
        <strong>Status:</strong>
        <span class="ms-2 badge" [class.text-bg-warning]="enabled" [class.text-bg-secondary]="!enabled">
          {{ enabled ? 'enabled' : 'disabled' }}
        </span>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-warning" [disabled]="enabled" (click)="enable()">Enable</button>
        <button class="btn btn-outline-secondary" [disabled]="!enabled" (click)="disable()">Disable</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h2 class="h5">Reset admin password</h2>
      <p class="text-body-secondary small">Requires recovery mode enabled and localhost access.</p>
      <div class="row g-2">
        <div class="col-12 col-md-4">
          <input class="form-control" placeholder="Username" [(ngModel)]="username" />
        </div>
        <div class="col-12 col-md-4">
          <input class="form-control" type="password" placeholder="New password" [(ngModel)]="password" />
        </div>
        <div class="col-12 col-md-4">
          <button class="btn btn-danger w-100" [disabled]="!enabled" (click)="resetPassword()">Reset password</button>
        </div>
      </div>
    </div>
  </div>
</div>
