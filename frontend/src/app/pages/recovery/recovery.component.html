<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h1 class="h3 mb-1">{{ 'recovery.title' | t }}</h1>
      <p class="text-body-secondary mb-0">{{ 'recovery.subtitle' | t }}</p>
    </div>
    <a class="btn btn-outline-secondary btn-sm" routerLink="/home">{{ 'recovery.backToMenu' | t }}</a>
  </div>

  <div class="card mb-3">
    <div class="card-body d-flex justify-content-between align-items-center">
      <div>
        <strong>{{ 'recovery.statusLabel' | t }}</strong>
        <span class="ms-2 badge" [class.text-bg-warning]="enabled" [class.text-bg-secondary]="!enabled">
          {{ (enabled ? 'recovery.status.enabled' : 'recovery.status.disabled') | t }}
        </span>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-warning" [disabled]="enabled" (click)="enable()">{{ 'recovery.enableButton' | t }}</button>
        <button class="btn btn-outline-secondary" [disabled]="!enabled" (click)="disable()">{{ 'recovery.disableButton' | t }}</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h2 class="h5">{{ 'recovery.resetPassword.heading' | t }}</h2>
      <p class="text-body-secondary small">{{ 'recovery.resetPassword.description' | t }}</p>
      <div class="row g-2">
        <div class="col-12 col-md-4">
          <input class="form-control" [placeholder]="'recovery.resetPassword.usernamePlaceholder' | t" [(ngModel)]="username" />
        </div>
        <div class="col-12 col-md-4">
          <input class="form-control" type="password" [placeholder]="'recovery.resetPassword.passwordPlaceholder' | t" [(ngModel)]="password" />
        </div>
        <div class="col-12 col-md-4">
          <button class="btn btn-danger w-100" [disabled]="!enabled" (click)="resetPassword()">{{ 'recovery.resetPassword.submitButton' | t }}</button>
        </div>
      </div>
    </div>
  </div>
</div>
