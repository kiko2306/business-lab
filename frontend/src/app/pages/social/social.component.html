<main class="container-fluid py-4">
  <div class="mb-4">
    <h1 class="h3 mb-1">{{ 'social.title' | t }}</h1>
    <p class="text-body-secondary mb-0">
      {{ 'social.subtitle' | t }}
    </p>
  </div>

  <app-panel key="social:generate" [title]="'social.generatePanel.title' | t" [subtitle]="'social.generatePanel.subtitle' | t">
    <form (ngSubmit)="generate()">
      <label class="form-label fw-semibold" for="prompt">{{ 'social.briefLabel' | t }}</label>
      <textarea
        id="prompt"
        class="form-control"
        rows="4"
        [(ngModel)]="prompt"
        [ngModelOptions]="{ standalone: true }"
        [placeholder]="'social.briefPlaceholder' | t"
      ></textarea>
      <div class="mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="generating || !prompt.trim()">
          {{ (generating ? 'social.generating' : 'social.generateButton') | t }}
        </button>
        <span *ngIf="generating" class="small text-body-secondary ms-2">{{ 'social.callingClaude' | t }}</span>
      </div>
    </form>
  </app-panel>

  <app-panel key="social:drafts" [title]="'social.draftsPanel.title' | t" [subtitle]="'social.draftsPanel.subtitle' | t">
    <div *ngIf="drafts === null" class="text-body-secondary small">{{ 'common.loading' | t }}</div>
    <div *ngIf="drafts && drafts.length === 0" class="text-body-secondary small">
      {{ 'social.noDraftsYet' | t }}
    </div>

    <div *ngFor="let draft of drafts" class="border rounded p-3 mb-3">
      <p class="small text-body-secondary mb-2">
        <span class="fw-semibold">{{ 'social.briefPrefix' | t }}</span> {{ draft.prompt }}
      </p>
      <textarea
        class="form-control mb-2"
        rows="4"
        [ngModel]="edits[draft.id]"
        (ngModelChange)="edits[draft.id] = $event"
        [ngModelOptions]="{ standalone: true }"
      ></textarea>
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <button
          type="button"
          class="btn btn-sm btn-primary"
          [disabled]="savingId === draft.id || !isDirty(draft)"
          (click)="save(draft)"
        >
          {{ (savingId === draft.id ? 'common.saving' : 'social.saveButton') | t }}
        </button>
        <button
          type="button"
          class="btn btn-sm btn-outline-primary"
          [disabled]="publishingId === draft.id"
          (click)="publish(draft)"
        >
          {{ (publishingId === draft.id ? 'social.publishing' : 'social.publishButton') | t }}
        </button>
        <button
          type="button"
          class="btn btn-sm btn-outline-danger"
          [disabled]="deletingId === draft.id"
          (click)="remove(draft)"
        >
          {{ (deletingId === draft.id ? 'social.deleting' : 'social.deleteButton') | t }}
        </button>
        <span class="small text-body-secondary ms-auto">
          {{ draft.updatedAt | date: 'medium':undefined:translate.locale() }}
        </span>
      </div>
    </div>
  </app-panel>
</main>
