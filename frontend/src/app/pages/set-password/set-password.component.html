<main class="auth-page container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-9 col-lg-8 col-xl-7">
      <section class="card border-0 shadow auth-card">
        <div class="card-body p-4 p-lg-5">
          <div class="text-center mb-4">
            <span class="auth-kicker">Welcome</span>
            <h1 class="h3 mt-2 mb-2">Set your password</h1>
            <p class="text-body-secondary mb-0" *ngIf="invite">
              Choose a password for <strong>{{ invite.username }}</strong> ({{ invite.email }}).
            </p>
          </div>

          <div *ngIf="loading" class="text-center text-body-secondary py-4">
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
            Checking your link…
          </div>

          <div *ngIf="!loading && linkError" class="alert alert-danger">
            {{ linkError }}
          </div>

          <form *ngIf="!loading && !linkError" [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="spPassword">Password</label>
              <input
                id="spPassword"
                type="password"
                class="form-control form-control-lg"
                formControlName="password"
                autocomplete="new-password"
                maxlength="128"
                (paste)="sanitizePaste($event, 'password')"
              />
              <div *ngIf="form.controls.password.touched && form.controls.password.invalid" class="text-danger small mt-1">
                Password must be 8-128 characters.
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold" for="spConfirm">Confirm password</label>
              <input
                id="spConfirm"
                type="password"
                class="form-control form-control-lg"
                formControlName="confirmPassword"
                autocomplete="new-password"
                maxlength="128"
                (paste)="sanitizePaste($event, 'confirmPassword')"
              />
              <div *ngIf="form.controls.confirmPassword.touched && mismatch" class="text-danger small mt-1">
                The passwords don't match.
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="submitting || form.invalid || mismatch">
              <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
              Set password &amp; sign in
            </button>
          </form>

          <p class="text-center text-body-secondary small mt-4 mb-0" *ngIf="linkError">
            <a routerLink="/login">Go to sign in</a>
          </p>
        </div>
      </section>
    </div>
  </div>
</main>
