<main class="container-fluid py-4">
  <section class="mb-4">
    <h1 class="h3 mb-1">{{ 'home.title' | t }}</h1>
    <p class="home-status text-body-secondary mb-0" aria-live="polite" *ngIf="showStatus && (serviceState.summary$ | async) as s; else subtitle">
      <a *ngIf="s.total > 0; else subtitle" routerLink="/apps" class="home-status__link" [class.home-status__link--issue]="s.error > 0">
        {{ (s.error ? 'apps.headline.needYou' : 'apps.headline.allFine') | t:{ count: s.error, total: s.total } }}
      </a>
    </p>
    <ng-template #subtitle><p class="text-body-secondary mb-0">{{ 'home.subtitle' | t }}</p></ng-template>
  </section>

  <div class="menu-grid">
    <a
      *ngFor="let tile of visibleTiles"
      class="menu-tile card text-decoration-none text-reset"
      [class.menu-tile--wide]="tile.wide && useBento"
      [routerLink]="tile.link"
    >
      <div class="card-body">
        <h2 class="h5 mb-1">{{ tile.titleKey | t }}</h2>
        <p class="menu-tile__desc text-body-secondary small mb-0">{{ tile.descriptionKey | t }}</p>
      </div>
    </a>
  </div>
</main>
