<main class="container-fluid py-4">
  <section class="mb-4">
    <h1 class="h3 mb-1">{{ 'home.title' | t }}</h1>
    <p class="text-body-secondary mb-0">{{ 'home.subtitle' | t }}</p>
  </section>

  <div class="menu-grid">
    <a
      *ngFor="let tile of visibleTiles"
      class="menu-tile card text-decoration-none text-reset"
      [class.menu-tile--wide]="tile.wide && useBento"
      [class.menu-tile--pending]="tile.pending"
      [routerLink]="tile.link"
    >
      <div class="card-body">
        <h2 class="h5 mb-1">{{ tile.titleKey | t }}</h2>
        <p class="menu-tile__desc text-body-secondary small mb-0">{{ tile.descriptionKey | t }}</p>
      </div>
      <span *ngIf="tile.pending" class="menu-tile__badge badge text-bg-secondary">
        {{ 'home.pendingBadge' | t }}
      </span>
    </a>
  </div>
</main>
