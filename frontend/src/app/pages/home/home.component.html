<main class="container-fluid py-4">
  <section class="mb-4">
    <h1 class="h3 mb-1">Menu</h1>
    <p class="text-body-secondary mb-0">Pick an area to manage.</p>
  </section>

  <div class="menu-grid">
    <a
      *ngFor="let tile of tiles"
      class="menu-tile card text-decoration-none text-reset h-100"
      [routerLink]="tile.link"
      [fragment]="tile.fragment"
    >
      <div class="card-body">
        <h2 class="h5 mb-1">{{ tile.title }}</h2>
        <p class="text-body-secondary small mb-0">{{ tile.description }}</p>
        <span *ngIf="tile.pending" class="badge text-bg-secondary border">
          Opens in {{ tile.link === '/apps' ? 'Apps' : 'Dashboard' }}
        </span>
      </div>
    </a>
  </div>
</main>
