<article class="card h-100 border-0 shadow-sm service-card">
  <div class="card-body d-flex flex-column">
    <div class="d-flex align-items-start gap-3">
      <div class="service-icon">{{ serviceIcon(service.icon) }}</div>
      <div class="flex-grow-1">
        <div class="d-flex flex-wrap align-items-center gap-2">
          <h2 class="h5 mb-0">{{ service.label }}</h2>
          <span class="badge text-bg-{{ stateBadge(service.state) }}">{{ service.state }}</span>
          <span class="badge bg-white border" [ngClass]="healthClass()">{{ healthLabel() }}</span>
        </div>
        <p class="small text-body-secondary mt-2 mb-0">
          {{ service.description }}
        </p>
      </div>
    </div>

    <div class="small text-body-secondary mt-3">
      Last updated {{ service.lastChecked | date: 'shortTime' }}
    </div>

    <div *ngIf="service.error" class="alert alert-danger py-2 px-3 mt-3 mb-0 small">
      {{ service.error }}
    </div>

    <div class="mt-auto d-flex gap-2 pt-3">
      <button
        type="button"
        class="btn btn-success flex-grow-1"
        [disabled]="loadingAction !== null || service.state === 'running' || service.state === 'starting'"
        (click)="requestAction('start')"
      >
        <span *ngIf="loadingAction === 'start'" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
        Start
      </button>
      <button
        type="button"
        class="btn btn-outline-danger flex-grow-1"
        [disabled]="loadingAction !== null || service.state !== 'running'"
        (click)="requestAction('stop')"
      >
        <span *ngIf="loadingAction === 'stop'" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
        Stop
      </button>
    </div>

    <div class="pt-2">
      <button type="button" class="btn btn-link btn-sm px-0" (click)="toggleExposurePanel()">
        {{ exposurePanelOpen ? 'Hide exposure settings' : 'Exposure settings' }}
      </button>

      <div *ngIf="exposurePanelOpen" class="exposure-panel border-top pt-3 mt-1">
        <div *ngIf="exposureLoading" class="d-flex align-items-center gap-2 text-body-secondary small">
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
          Loading...
        </div>

        <ng-container *ngIf="!exposureLoading && exposure">
          <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" id="exposureEnabled-{{ service.name }}" [(ngModel)]="exposureEnabled" />
            <label class="form-check-label small" for="exposureEnabled-{{ service.name }}">
              Publicly expose this service
            </label>
          </div>

          <div *ngIf="exposure.hostname" class="small text-body-secondary mb-2">
            Public hostname: <code>{{ exposure.hostname }}</code>
            <span class="badge ms-1" [class.text-bg-success]="exposure.status === 'provisioned'" [class.text-bg-secondary]="exposure.status === 'not_provisioned'" [class.text-bg-danger]="exposure.status === 'failed'">
              {{ exposure.status }}
            </span>
          </div>
          <div *ngIf="exposure.lastError" class="alert alert-danger py-1 px-2 small mb-2">{{ exposure.lastError }}</div>

          <div class="row g-2">
            <div class="col-7">
              <input class="form-control form-control-sm" placeholder="Upstream host" [(ngModel)]="exposureUpstreamHost" />
            </div>
            <div class="col-5">
              <input class="form-control form-control-sm" type="number" placeholder="Port" [(ngModel)]="exposureUpstreamPort" />
            </div>
          </div>
          <div class="d-flex gap-3 align-items-center mt-2">
            <select class="form-select form-select-sm w-auto" [(ngModel)]="exposureUpstreamScheme">
              <option value="http">http</option>
              <option value="https">https</option>
            </select>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="exposureWs-{{ service.name }}" [(ngModel)]="exposureWebsocket" />
              <label class="form-check-label small" for="exposureWs-{{ service.name }}">Websocket</label>
            </div>
          </div>

          <button type="button" class="btn btn-outline-primary btn-sm mt-2" [disabled]="exposureSaving" (click)="saveExposure()">
            <span *ngIf="exposureSaving" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
            Save exposure settings
          </button>
        </ng-container>
      </div>
    </div>
  </div>
</article>
