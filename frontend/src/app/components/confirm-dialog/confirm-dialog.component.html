@if (confirm.request$ | async; as req) {
  <div
    class="confirm-backdrop"
    (click)="onBackdrop($event)"
    >
    <div
      class="confirm-dialog"
      role="alertdialog"
      aria-modal="true"
      appModalFocus
      (dismiss)="respond(false)"
      [attr.aria-label]="req.title || ('confirmDialog.defaultAriaLabel' | t)"
      >
      <div class="confirm-body">
        @if (req.title) {
          <h2 class="h5 mb-2">{{ req.title }}</h2>
        }
        <p class="mb-0 confirm-message">{{ req.message }}</p>
      </div>
      <div class="confirm-foot">
        <button type="button" class="btn btn-outline-secondary" (click)="respond(false)">
          {{ req.cancelText || ('common.cancel' | t) }}
        </button>
        <button
          type="button"
          class="btn"
          [class.btn-danger]="req.danger"
          [class.btn-primary]="!req.danger"
          (click)="respond(true)"
          >
          {{ req.confirmText || ('confirmDialog.defaultConfirmText' | t) }}
        </button>
      </div>
    </div>
  </div>
}
