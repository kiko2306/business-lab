<div class="rs" *ngIf="meters as list">
  <div class="rs__meter" *ngFor="let m of list" [attr.data-level]="level(m)" [title]="m.title" [ngSwitch]="m.key">
    <div class="rs__top">
      <svg *ngSwitchCase="'cpu'" class="rs__icon" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="4" y="4" width="8" height="8" rx="1" />
        <line x1="6" y1="1" x2="6" y2="4" />
        <line x1="10" y1="1" x2="10" y2="4" />
        <line x1="6" y1="12" x2="6" y2="15" />
        <line x1="10" y1="12" x2="10" y2="15" />
        <line x1="1" y1="6" x2="4" y2="6" />
        <line x1="1" y1="10" x2="4" y2="10" />
        <line x1="12" y1="6" x2="15" y2="6" />
        <line x1="12" y1="10" x2="15" y2="10" />
      </svg>
      <svg *ngSwitchCase="'memory'" class="rs__icon" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1" y="6" width="14" height="6" rx="1" />
        <line x1="4" y1="6" x2="4" y2="3" />
        <line x1="7" y1="6" x2="7" y2="3" />
        <line x1="10" y1="6" x2="10" y2="3" />
        <line x1="13" y1="6" x2="13" y2="3" />
      </svg>
      <svg *ngSwitchCase="'disk'" class="rs__icon" viewBox="0 0 16 16" aria-hidden="true">
        <ellipse cx="8" cy="3.5" rx="6" ry="2" />
        <path d="M2 3.5v9c0 1.1 2.7 2 6 2s6-.9 6-2v-9" />
        <path d="M2 8c0 1.1 2.7 2 6 2s6-.9 6-2" />
      </svg>
      <span class="rs__primary">{{ m.primary }}</span>
      <span class="rs__label">{{ m.label }}</span>
    </div>
    <span class="rs__track"><span class="rs__fill" [style.width.%]="m.percent"></span></span>
  </div>
</div>
