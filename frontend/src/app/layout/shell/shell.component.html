<div class="app-shell">
  <header class="app-header border-bottom sticky-top">
    <div class="container-fluid py-2">
      <div class="app-header__bar">
        <a class="app-header__brand text-decoration-none text-reset" routerLink="/home">
          <div class="app-header__title fw-semibold d-flex align-items-center gap-2">
            <img src="favicon.svg" alt="" width="26" height="26" />
            Business Lab
          </div>
          <div class="small text-body-secondary text-truncate" *ngIf="user$ | async as user">
            Signed in as {{ user.username }}
          </div>
        </a>
        <app-resource-strip class="app-header__resources"></app-resource-strip>
        <nav class="app-header__actions">
          <a class="app-nav__link" routerLink="/home" routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }">Menu</a>
          <a class="app-nav__link" routerLink="/apps" routerLinkActive="active">Apps</a>
          <a class="app-nav__link" routerLink="/backups" routerLinkActive="active">Backups</a>
          <a class="app-nav__link" routerLink="/exposure" routerLinkActive="active">Exposure</a>
          <a class="app-nav__link" routerLink="/settings" routerLinkActive="active">Settings</a>
          <a class="app-nav__link" routerLink="/utils" routerLinkActive="active">Utils</a>
          <a class="app-nav__link" routerLink="/users" routerLinkActive="active">Users &amp; roles</a>
          <a class="app-nav__link" routerLink="/audit-logs" routerLinkActive="active">Audit logs</a>
          <a class="app-nav__link" routerLink="/account" routerLinkActive="active">Security</a>
          <a class="app-nav__link app-nav__link--warning" routerLink="/recovery">Recovery</a>
        </nav>
        <button type="button" class="btn btn-outline-danger btn-sm app-header__logout" (click)="logout()">Logout</button>
      </div>
    </div>
  </header>

  <router-outlet></router-outlet>

  <footer class="app-footer text-body-secondary">
    <div class="container-fluid py-3">
      Business Lab<span *ngIf="appVersion"> v{{ appVersion }}</span>
    </div>
  </footer>
</div>
