server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the client address before anything else sees it: take
    # X-Forwarded-For only from the Docker gateway (the host-side cloudflared
    # hop, written by 40-real-ip-from-gateway.sh), using its last untrusted
    # entry — the one Cloudflare appended. A LAN client's own header is
    # ignored. $remote_addr is the resolved client from here on, and the /api
    # locations below hand exactly that to the backend (plan.md §516).
    include /etc/nginx/real-ip-from.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Serve Angular app; fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's bundled mime.types has no entry for .webmanifest. Scope the fix to
    # a location so the inherited type map is left intact for everything else.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # The service worker must always be revalidated, otherwise a stale cached
    # sw.js keeps serving an old app shell after a deploy.
    # `expires -1` sends the same Cache-Control: no-cache without add_header:
    # a location with any add_header of its own inherits none of the
    # server-level security headers below, which sw.js used to lose (§522).
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    # index.html is the one unhashed file that names the current bundles. With
    # no Cache-Control, browsers heuristically cache a Last-Modified response
    # for ~10% of its age, so an installed phone app kept launching the old
    # build for hours after a deploy — the service worker's "network-first"
    # navigation still goes through the HTTP cache. `try_files`' /index.html
    # fallback and `index` both re-enter location matching, so this also covers
    # `/` and every SPA route. Same `expires -1` trick as sw.js (no add_header).
    location = /index.html {
        expires -1;
    }

    # Proxy API requests to the backend service.
    # A bare "/api" (no trailing slash) needs its own exact match: nginx's
    # default redirect for a prefix-style location drops the port from the
    # Location header (it uses $host, not $http_host), which breaks setups
    # served on a non-default port.
    location = /api {
        proxy_pass http://backend:3000/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Overwrite, never append or pass through: the backend trusts one hop
        # (TRUST_PROXY=1) and reads this as the client address for rate
        # limits and recovery mode's localhost-only check.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cache_bypass $http_upgrade;
        # A first-run "start service" waits on `docker compose up`, which for a
        # large multi-image app pulls for minutes; outlast the backend's own
        # 15-minute compose timeout. Also keeps SSE log streams alive.
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Overwrite, never append or pass through: the backend trusts one hop
        # (TRUST_PROXY=1) and reads this as the client address for rate
        # limits and recovery mode's localhost-only check.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    # Security headers. This nginx serves the dashboard straight to the tunnel
    # (NPM is bypassed, docs/first-run.md), so nothing upstream adds these.
    # `always` so error pages carry them too. Keep every location free of its
    # own add_header, or it silently drops all of these (nginx inheritance).
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Browsers ignore HSTS on plain-HTTP responses, so the LAN http:// address
    # keeps working. No includeSubDomains: each app hostname is NPM's to set.
    add_header Strict-Transport-Security "max-age=63072000" always;
    # Everything the SPA loads is same-origin. style-src needs 'unsafe-inline'
    # for the <style> tags Angular injects per component; Bootstrap's form
    # icons are data: SVGs. script-src stays strict, which is why the build
    # has inlineCritical off (it emits an inline onload handler).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
}
