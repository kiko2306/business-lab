name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build

  price-compare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/price-compare/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/price-compare/app/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    # Browser E2E: brings up docker-compose.test.yml and drives the real
    # dashboard with Playwright (login, navigation, invite-gated Users page,
    # the full TOTP journey). Everything runs in containers, so no setup-node.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the Playwright suite against the test stack
        run: scripts/e2e-tests.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
