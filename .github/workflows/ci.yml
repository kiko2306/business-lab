name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build

  price-compare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/price-compare/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/price-compare/app/package-lock.json
      - run: npm ci
      - run: npm test

  tally:
    # Its own job, like price-compare: app-owned code with its own lockfile.
    # The postgres service is the point — the deliverable of this slice is the
    # schema, and the check that matters is that it applies to a real server
    # (and applies twice, since every boot re-runs every migration file).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tally/app/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tally
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tally
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tally"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/tally/app/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # tsc does not copy .sql; the Dockerfile does the same thing.
      - run: cp -r src/migrations dist/migrations
      - run: npm test
        env:
          DATABASE_URL: postgres://tally:test@localhost:5432/tally

  hotel-core:
    # Same shape as the tally job: the deliverable of this slice is a schema,
    # so the check that matters is that it applies to a real server — and
    # applies twice, since every boot re-runs every migration file.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hotel/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hotel
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hotel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/hotel/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # tsc does not copy .sql; the Dockerfile does the same thing.
      - run: cp -r src/migrations dist/migrations
      - run: npm test
        env:
          DATABASE_URL: postgres://hotel:test@localhost:5433/hotel

  hotel-import:
    # The one-time cutover import (plan.md §658). Two real ephemeral
    # databases rather than one: a MySQL fixture shaped like the legacy
    # Laravel schema, and a Postgres one built from hotel-core's own
    # migration files (read from ../api/src/migrations at test time) so this
    # can never drift from the schema it actually imports into.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hotel/import
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hotel
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U hotel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: legacy
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/hotel/import/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          DATABASE_URL: postgres://hotel:test@localhost:5436/hotel
          MYSQL_URL: mysql://root@127.0.0.1:3307/legacy

  hotel-admin:
    # The Angular admin shell. Its theme is a generated copy of the
    # dashboard's (scripts/sync-app-theme.sh) because an app image builds from
    # its own apps/<name>/ context and cannot reach frontend/src — so the diff
    # below is what catches the two drifting apart (plan.md §633).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme copy is in step with the dashboard's
        run: diff frontend/src/styles.css apps/hotel/admin/src/theme.css
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/hotel/admin/package-lock.json
      - run: npm ci
        working-directory: apps/hotel/admin
      - run: npm run build
        working-directory: apps/hotel/admin

  hotel-checkin:
    # The guest-facing check-in app — same shape as hotel-admin's job, and the
    # same theme-drift reasoning (plan.md §641).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme copy is in step with the dashboard's
        run: diff frontend/src/styles.css apps/hotel/checkin/src/theme.css
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/hotel/checkin/package-lock.json
      - run: npm ci
        working-directory: apps/hotel/checkin
      - run: npm run build
        working-directory: apps/hotel/checkin

  hotel-pulse:
    # The guest-facing feedback app — same shape as hotel-checkin's job, and
    # the same theme-drift reasoning (plan.md §644).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme copy is in step with the dashboard's
        run: diff frontend/src/styles.css apps/hotel/pulse/src/theme.css
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/hotel/pulse/package-lock.json
      - run: npm ci
        working-directory: apps/hotel/pulse
      - run: npm run build
        working-directory: apps/hotel/pulse

  tally-web:
    # The Angular admin UI. Its theme is a generated copy of the dashboard's
    # (scripts/sync-app-theme.sh) because an app image builds from its own
    # apps/<name>/ context and cannot reach frontend/src — so the diff below
    # is what catches the two drifting apart (plan.md §633).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme copy is in step with the dashboard's
        run: diff frontend/src/styles.css apps/tally/app/web/src/theme.css
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/tally/app/web/package-lock.json
      - run: npm ci
        working-directory: apps/tally/app/web
      - run: npm run build
        working-directory: apps/tally/app/web

  tally-agent:
    # Builds on Linux because the tally agent is plain net8.0: it only reads
    # Wintouch over SQL, so it never loads their x86 assemblies (plan.md §636).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tally/app/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build -warnaserror

  e2e:
    # Browser E2E: brings up docker-compose.test.yml and drives the real
    # dashboard with Playwright (login, navigation, invite-gated Users page,
    # the full TOTP journey). Everything runs in containers, so no setup-node.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the Playwright suite against the test stack
        run: scripts/e2e-tests.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
