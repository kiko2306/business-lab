version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-}
    image: homelab-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - homelab-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    image: homelab-backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://homelab:${POSTGRES_PASSWORD}@database:5432/homelab}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:80}
      SCRIPTS_DIR: /scripts
      APPS_DIR: ${APPS_DIR:?APPS_DIR must be set to an absolute path in .env}
      # Health check URLs target the host, which is not "localhost" in here.
      SERVICE_HEALTH_HOST: ${SERVICE_HEALTH_HOST:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - scripts-data:/scripts:ro
      # Lets the backend drive the host Docker daemon to start/stop app stacks.
      - /var/run/docker.sock:/var/run/docker.sock
      # Mounted at the same absolute path as on the host so that any relative
      # paths inside an app's compose file resolve identically in both places.
      - ${APPS_DIR:?APPS_DIR must be set to an absolute path in .env}:${APPS_DIR}:ro
    depends_on:
      database:
        condition: service_healthy
    networks:
      - homelab-net
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homelab}
      POSTGRES_USER: ${POSTGRES_USER:-homelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - homelab-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homelab} -d ${POSTGRES_DB:-homelab}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # database is NOT exposed on host ports intentionally

volumes:
  db-data:
    driver: local
  scripts-data:
    driver: local

networks:
  homelab-net:
    driver: bridge
