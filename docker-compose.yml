
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-}
    image: homelab-frontend
    ports:
      - "${FRONTEND_PORT:-10001}:80"
    depends_on:
      - backend
    networks:
      - homelab-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    image: homelab-backend
    ports:
      # Bound to loopback only. The dashboard never uses this publish — the
      # frontend proxies /api/ to backend:3000 over the compose network
      # (docs/ports.md) — and public ingress is Cloudflare -> NPM -> backend.
      # Its only consumers are host-local: `curl localhost` while debugging
      # and scripts/smoke-tests.sh (API_BASE_URL defaults to localhost:3000).
      # None of those need it on the LAN, and an ungated API on every host
      # interface is attack surface, so it stays on 127.0.0.1 (plan.md §167).
      - "127.0.0.1:${BACKEND_PORT:-10000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-homelab}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-homelab}}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-1h}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:80}
      SCRIPTS_DIR: /scripts
      APPS_DIR: ${APPS_DIR:?APPS_DIR must be set to an absolute path in .env}
      # Health check URLs target the host, which is not "localhost" in here.
      SERVICE_HEALTH_HOST: ${SERVICE_HEALTH_HOST:-host.docker.internal}
      # The docker CLI (used for `docker ps` / `docker compose up|down`)
      # honors this instead of the local socket — see docker-socket-proxy
      # below for why the raw socket isn't mounted here anymore.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - scripts-data:/scripts:ro
      # Mounted at the same absolute path as on the host so that any relative
      # paths inside an app's compose file resolve identically in both places.
      # Read-write: the backend creates/updates each app's .env from the
      # dashboard (see appEnv.ts) so secrets never need manual editing.
      # Compose files themselves are only ever read, never written, by
      # backend code.
      - ${APPS_DIR:?APPS_DIR must be set to an absolute path in .env}:${APPS_DIR}
      # Read-only view of the host root, purely so the health check can df it.
      # Without this the only filesystem the backend can measure is its own
      # overlay — which follows Docker's data-root, so moving that storage to
      # another filesystem would leave the host's root silently unwatched
      # (plan.md §83.3).
      - /:/hostfs:ro
      - backups-data:/app/backups
      # The backend's own log files. On the container's writable layer they
      # died with it, which erased the day under investigation twice in one
      # session (plan.md §88.4) — a backup system whose failures are not
      # legible afterwards gets debugged by guessing. The logger rotates at
      # 5 MB so outliving the container does not mean growing without limit.
      - logs-data:/app/logs
    depends_on:
      database:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    networks:
      - homelab-net
    restart: unless-stopped

  # Scopes the backend's Docker access instead of mounting the raw host
  # socket into it directly. Only the categories `docker ps` and
  # `docker compose up|down` actually need are enabled — notably EXEC,
  # BUILD, SECRETS, SWARM, and PLUGINS stay off; the backend never uses them.
  # This narrows things like arbitrary `docker exec` into any container on
  # the host, but can't fully sandbox compose itself: CONTAINERS+POST is
  # inherently enough to create a container with its own bind mounts, so
  # this is a reduction in blast radius, not a full jail — the backend is
  # still meant for trusted operators only.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      INFO: 1
      VERSION: 1
      PING: 1
      EVENTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab-net
    restart: unless-stopped
    # Not published to the host — only reachable from other containers on
    # homelab-net, by service name.

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homelab}
      POSTGRES_USER: ${POSTGRES_USER:-homelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - homelab-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homelab} -d ${POSTGRES_DB:-homelab}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # database is NOT exposed on host ports intentionally

volumes:
  db-data:
    driver: local
  scripts-data:
    driver: local
  logs-data:
    driver: local
  backups-data:
    driver: local

networks:
  homelab-net:
    driver: bridge
