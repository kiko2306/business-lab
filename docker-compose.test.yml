name: homelab-test

# Throwaway stack for the API smoke tests (scripts/docker-e2e-test.sh) and the
# browser E2E suite (scripts/e2e-tests.sh). Services talk to each other over
# the default compose network by name — no fixed subnet, which used to collide
# with whatever else was already on the host's 172.28.0.0/16.

services:
  frontend:
    image: nginx:1.27-alpine
    ports:
      - "18080:80"
    depends_on:
      - backend
    volumes:
      # The same nginx config production ships (frontend/Dockerfile bakes it
      # in): it proxies /api/ to the backend, which the SPA relies on — the
      # old nginx.test.conf omitted that, so the browser E2E suite couldn't
      # reach the API at all.
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist/homelab-frontend/browser:/usr/share/nginx/html:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: homelab-backend:test
    ports:
      - "13000:3000"
    environment:
      NODE_ENV: test
      PORT: 3000
      POSTGRES_DB: homelab_test
      POSTGRES_USER: homelab
      POSTGRES_PASSWORD: homelab_test_pw
      POSTGRES_HOST: database
      JWT_SECRET: test-jwt-secret-phase-f
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-phase-f
      CORS_ORIGIN: http://localhost:18080
      REQUEST_BODY_LIMIT: 32kb
    depends_on:
      database:
        condition: service_healthy
    # The image's entrypoint chowns /app/backups (normally the backups-data
    # volume) before dropping privileges, and aborts under `set -e` if it is
    # missing. The E2E suite takes no backups, so an ephemeral tmpfs is enough.
    tmpfs:
      - /app/backups

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: homelab_test
      POSTGRES_USER: homelab
      POSTGRES_PASSWORD: homelab_test_pw
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homelab -d homelab_test"]
      interval: 10s
      timeout: 5s
      retries: 8
